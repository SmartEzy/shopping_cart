<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>購物車</title>

  <!-- PWA & iOS Mobile Web App Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="購物車">
  <meta name="theme-color" content="#F7F5F2">

  <!-- Home Screen & Browser Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    /* =========================================
       Soft Light Morandi Color Tokens
       ========================================= */
    :root {
      --bg-page: #F7F5F2;
      --bg-card: #FFFFFF;
      --bg-input: #FFFFFF;
      --border-header: #EAE6DF;
      --border-card: #E6E2DC;
      --border-input: #E6E2DC;
      --border-focus: #A8BAC9;

      /* Primary Action & Checked Checkbox: Soft Morandi Slate Blue */
      --primary: #C8D6E2;
      --primary-active: #B8C9D8;
      --primary-text: #3A4B59;

      /* Edit Mode Update: Soft Morandi Sage Green */
      --secondary: #C5D6C8;
      --secondary-active: #B5C9B9;
      --secondary-text: #394D3E;

      /* Neutral Controls */
      --neutral: #ECE8E2;
      --neutral-active: #E0DBD3;

      /* Delete / Over-Budget: Soft Dusty Rose */
      --danger: #E8CECE;
      --danger-border: #C48F8F;
      --danger-active: #DCBDBD;
      --danger-text: #7A4B4B;
      --danger-soft-bg: #FAF2F2;

      /* Checkbox & Progress Bar */
      --checkbox-checked: #C8D6E2;
      --checkbox-checked-border: #B2C3D2;
      --checkbox-icon: #3A4B59;
      --prog-track: #EAE6DF;
      --prog-normal: #AFC4B4;
      --prog-warning: #DFC498;
      --prog-over: #C48F8F;

      /* Typography */
      --text-primary: #4A4A48;
      --text-muted: #8C8881;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-card: 0 1px 2px rgba(74, 74, 72, 0.04);
      --shadow-sticky: 0 -2px 10px rgba(74, 74, 72, 0.04);
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* =========================================
       Crisp Solid Sticky Header (No Blur)
       ========================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 60;
      width: 100%;
      background-color: var(--bg-page);
      border-bottom: 1px solid var(--border-header);
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    }

    .app-header-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    /* Compact Clickable Budget Pill */
    .budget-bar {
      flex: 1;
      max-width: 248px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-input);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      font-family: inherit;
      text-align: left;
    }

    .budget-bar:active {
      transform: scale(0.98);
      border-color: var(--border-focus);
    }

    .budget-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
    }

    .budget-bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .budget-bar-muted {
      color: var(--text-muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .budget-bar-over {
      color: var(--danger-text);
      font-weight: 700;
      flex-shrink: 0;
    }

    .budget-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background-color: var(--prog-track);
      overflow: hidden;
    }

    .budget-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background-color: var(--prog-normal);
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    .budget-fill.warning {
      background-color: var(--prog-warning);
    }

    .budget-fill.over {
      background-color: var(--prog-over);
    }

    /* =========================================
       Main Content Container
       ========================================= */
    .app-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 12px calc(86px + env(safe-area-inset-bottom));
    }

    /* =========================================
       Compact 2-Row Frameless Input Area (3 Equal Columns)
       ========================================= */
    .input-panel {
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 10px;
    }

    .form-row-1 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .name-field-wrap {
      position: relative;
      min-width: 0;
    }

    /* Unified 48px Form Controls */
    .field-input,
    .field-select {
      width: 100%;
      height: 48px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-input);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      appearance: none;
      -webkit-appearance: none;
    }

    .field-input::placeholder {
      color: var(--text-muted);
      font-size: 14px;
    }

    .field-input:focus,
    .field-select:focus {
      background-color: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(168, 186, 201, 0.24);
    }

    .field-numeric {
      font-variant-numeric: tabular-nums;
    }

    /* Quantity Unified Control: Numeric Input + ▾ Select Overlay + ◀ ▶ Arrows */
    .qty-box {
      height: 48px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-input);
      background-color: var(--bg-input);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
      transition: border-color 0.18s, box-shadow 0.18s;
      min-width: 0;
      overflow: hidden;
    }

    .qty-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(168, 186, 201, 0.24);
    }

    .qty-input {
      flex: 1;
      min-width: 24px;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .qty-select-wrap {
      position: relative;
      width: 20px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    .qty-select-wrap:active {
      background-color: var(--bg-page);
    }

    .qty-select-caret {
      pointer-events: none;
      line-height: 1;
    }

    .qty-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .qty-arrows {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .qty-arrow-btn {
      width: 24px;
      height: 36px;
      border: none;
      border-radius: var(--radius-sm);
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.15s, transform 0.1s, opacity 0.15s;
    }

    .qty-arrow-btn:active {
      transform: scale(0.92);
      background-color: var(--primary);
      color: var(--primary-text);
    }

    .qty-arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* Select Wrapper with Chevron */
    .select-wrap {
      position: relative;
      min-width: 0;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 1.8px solid var(--text-muted);
      border-bottom: 1.8px solid var(--text-muted);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .select-wrap .field-select {
      padding-right: 24px;
      cursor: pointer;
    }

    /* History Autocomplete Dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 180px;
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-input);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 20px rgba(62, 60, 58, 0.1);
      z-index: 80;
      display: none;
      overflow: hidden;
    }

    .autocomplete-dropdown.open {
      display: block;
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--bg-page);
      font-size: 14px;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:active,
    .autocomplete-item:hover {
      background-color: var(--bg-page);
    }

    .autocomplete-name {
      color: var(--text-primary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .autocomplete-price {
      color: var(--text-muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Row 2 Action Slot (Add / Edit Modes) */
    .action-slot {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .btn {
      height: 48px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, transform 0.1s;
      padding: 0 10px;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-primary:hover,
    .btn-primary:active {
      background-color: var(--primary-active);
    }

    .btn-secondary {
      flex: 1;
      min-width: 0;
      background-color: var(--secondary);
      color: var(--secondary-text);
      padding: 0 6px;
      font-size: 14px;
    }

    .btn-secondary:hover,
    .btn-secondary:active {
      background-color: var(--secondary-active);
    }

    .btn-icon-neutral {
      width: 36px;
      flex-shrink: 0;
      padding: 0;
      background-color: var(--neutral);
      color: var(--text-primary);
      font-size: 15px;
    }

    .btn-icon-neutral:active {
      background-color: var(--neutral-active);
    }

    .btn-neutral-full {
      flex: 1;
      background-color: var(--neutral);
      color: var(--text-primary);
    }

    .btn-danger-full {
      flex: 1;
      background-color: var(--danger);
      color: var(--danger-text);
    }

    /* =========================================
       Single Compact Toolbar Row (Aligned Master Checkbox)
       ========================================= */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      padding-left: 11px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .toolbar::-webkit-scrollbar {
      display: none;
    }

    .master-select-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 2px 4px 2px 0;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .master-select-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .master-select-btn .checkbox-visual .icon-check,
    .master-select-btn .checkbox-visual .icon-dash {
      display: none;
    }

    .master-select-btn.is-checked .checkbox-visual,
    .master-select-btn.is-indeterminate .checkbox-visual {
      background-color: var(--checkbox-checked);
      border-color: var(--checkbox-checked-border);
    }

    .master-select-btn.is-checked .checkbox-visual .icon-check {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .master-select-btn.is-indeterminate .checkbox-visual .icon-dash {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .pill-btn {
      height: 32px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--border-input);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .pill-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .pill-btn.danger-pill {
      color: var(--danger-text);
      border-color: var(--danger);
      background-color: var(--danger-soft-bg);
    }

    .pill-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================
       Single-Row Shopping List Cards (No Empty Box)
       ========================================= */
    .shopping-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      min-height: 46px;
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: opacity 0.18s, border-color 0.18s, background-color 0.18s;
    }

    .item-row.unchecked {
      opacity: 0.55;
    }

    .item-row.editing-active {
      border-color: #A8BEA9;
      background-color: #F4F8F4;
      opacity: 1;
    }

    /* Morandi Checkbox */
    .checkbox-btn {
      width: 28px;
      height: 28px;
      margin: -3px;
      padding: 0;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-visual {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.8px solid #C8C2B8;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .checkbox-visual svg {
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.15s, transform 0.15s;
    }

    .item-row.checked .checkbox-visual {
      background-color: var(--checkbox-checked);
      border-color: var(--checkbox-checked-border);
    }

    .item-row.checked .checkbox-visual svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Item Name & Discount Badge */
    .item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-input);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact Inline Stepper */
    .row-stepper {
      display: flex;
      align-items: center;
      height: 30px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-input);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      overflow: hidden;
    }

    .row-stepper-btn {
      width: 26px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .row-stepper-btn:active {
      background-color: var(--neutral);
    }

    .row-stepper-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row-stepper-qty {
      min-width: 20px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    /* Far Right Subtotal */
    .item-subtotal {
      min-width: 54px;
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* =========================================
       Sticky Bottom Summary Footer (Solid #F7F5F2, No Blur)
       ========================================= */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-page);
      border-top: 1px solid var(--border-header);
      box-shadow: var(--shadow-sticky);
      z-index: 50;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .sticky-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .footer-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Inline Order Discount Input with Dedicated × Clear Button */
    .footer-deduct {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      padding: 0 5px 0 9px;
      border-radius: 999px;
      border: 1px solid var(--border-input);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color 0.18s, background-color 0.18s;
    }

    .footer-deduct:focus-within {
      background-color: #FFFFFF;
      border-color: var(--border-focus);
    }

    .footer-deduct.active {
      background-color: var(--danger-soft-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .footer-deduct-input {
      width: 44px;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 0;
      text-align: right;
    }

    .footer-deduct-input::placeholder {
      color: #B4AFA8;
      font-weight: 500;
    }

    .footer-deduct-clear {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background-color: rgba(138, 133, 126, 0.14);
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background-color 0.15s, color 0.15s, opacity 0.15s;
    }

    .footer-deduct.active .footer-deduct-clear {
      background-color: rgba(138, 78, 78, 0.15);
      color: var(--danger-text);
    }

    .footer-deduct-clear:active {
      transform: scale(0.9);
    }

    .footer-total {
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .footer-total-label {
      font-size: 12.5px;
      font-weight: 600;

  <script>
    (function () {
      'use strict';

      /* =========================================
         Constants & State
         ========================================= */
      const STORAGE_KEY = 'morandi_supermarket_cart_v1';

      const DISCOUNT_LABELS = {
        '1': '',
        '0.95': '95折',
        '0.9': '9折',
        '0.85': '85折',
        '0.8': '8折',
        '0.75': '75折',
        '0.7': '7折',
        '0.6': '6折',
        '0.5': '5折',
        'bogo': '買一送一'
      };

      let state = {
        items: [],
        budget: 0,
        flatDiscount: 0,
        sortByChecked: false,
        history: {} // { [name]: { price: number, updatedAt: number } }
      };

      let editingId = null;
      let pendingConfirmCallback = null;
      let toastTimer = null;

      /* =========================================
         DOM References
         ========================================= */
      const el = {
        budgetBarBtn: document.getElementById('budgetBarBtn'),
        budgetLabelText: document.getElementById('budgetLabelText'),
        budgetRightText: document.getElementById('budgetRightText'),
        budgetFill: document.getElementById('budgetFill'),

        inputPanel: document.getElementById('inputPanel'),
        itemForm: document.getElementById('itemForm'),
        itemNameInput: document.getElementById('itemNameInput'),
        autocompleteDropdown: document.getElementById('autocompleteDropdown'),
        itemPriceInput: document.getElementById('itemPriceInput'),
        itemQty: document.getElementById('itemQty'),
        itemQtySelect: document.getElementById('itemQtySelect'),
        qtyDecBtn: document.getElementById('qtyDecBtn'),
        qtyIncBtn: document.getElementById('qtyIncBtn'),
        itemDiscountSelect: document.getElementById('itemDiscountSelect'),
        itemDollarOffInput: document.getElementById('itemDollarOffInput'),

        addActions: document.getElementById('addActions'),
        editActions: document.getElementById('editActions'),
        cancelEditBtn: document.getElementById('cancelEditBtn'),

        masterSelectBtn: document.getElementById('masterSelectBtn'),
        masterSelectLabel: document.getElementById('masterSelectLabel'),
        sortToggleBtn: document.getElementById('sortToggleBtn'),
        clearCheckedBtn: document.getElementById('clearCheckedBtn'),
        clearAllBtn: document.getElementById('clearAllBtn'),
        shoppingList: document.getElementById('shoppingList'),

        footerCountText: document.getElementById('footerCountText'),
        footerDeductWrap: document.getElementById('footerDeductWrap'),
        flatDiscountInput: document.getElementById('flatDiscountInput'),
        clearFlatDiscountBtn: document.getElementById('clearFlatDiscountBtn'),
        grandTotalText: document.getElementById('grandTotalText'),

        budgetModal: document.getElementById('budgetModal'),
        budgetModalInput: document.getElementById('budgetModalInput'),
        budgetCancelBtn: document.getElementById('budgetCancelBtn'),
        budgetSaveBtn: document.getElementById('budgetSaveBtn'),

        confirmModal: document.getElementById('confirmModal'),
        confirmModalTitle: document.getElementById('confirmModalTitle'),
        confirmModalDesc: document.getElementById('confirmModalDesc'),
        confirmCancelBtn: document.getElementById('confirmCancelBtn'),
        confirmOkBtn: document.getElementById('confirmOkBtn'),

        toast: document.getElementById('toast')
      };

      /* =========================================
         Utility Functions
         ========================================= */
      function populateQtySelect() {
        el.itemQtySelect.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = String(i);
          if (i === 1) opt.selected = true;
          el.itemQtySelect.appendChild(opt);
        }
        setQtyValue(1);
      }

      /**
       * Sanitizes integer inputs (converts full-width digits, keeps digits only).
       */
      function sanitizeIntInput(raw) {
        return String(raw)
          .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/[^0-9]/g, '');
      }

      function getQtyValue() {
        const parsed = parseInt(sanitizeIntInput(el.itemQty.value), 10);
        return (!isNaN(parsed) && parsed >= 1) ? parsed : 1;
      }

      function setQtyValue(val) {
        const safe = Math.max(1, parseInt(val, 10) || 1);
        el.itemQty.value = String(safe);
        if (safe >= 1 && safe <= 20) {
          el.itemQtySelect.value = String(safe);
        }
        syncQtyArrowState();
      }

      function syncQtyArrowState() {
        const val = getQtyValue();
        el.qtyDecBtn.disabled = val <= 1;
      }

      /**
       * Sanitizes numeric inputs (converts full-width digits, keeps up to 2 decimals).
       */
      function sanitizeDecimalInput(raw) {
        let str = String(raw)
          .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/．/g, '.')
          .replace(/[^0-9.]/g, '');

        const parts = str.split('.');
        if (parts.length > 2) {
          str = parts[0] + '.' + parts.slice(1).join('');
        }
        if (parts[1] && parts[1].length > 2) {
          str = parts[0] + '.' + parts[1].slice(0, 2);
        }
        return str;
      }

      function formatMoney(amount) {
        const rounded = Math.round((Number(amount) || 0) * 100) / 100;
        const isInt = Math.abs(rounded - Math.round(rounded)) < 0.001;
        return rounded.toLocaleString('zh-TW', {
          minimumFractionDigits: isInt ? 0 : 1,
          maximumFractionDigits: 2
        });
      }

      /**
       * Calculates item subtotal: percentage/BOGO discount first, then fixed dollarOff (min 0), rounded to integer.
       */
      function calcItemSubtotal(item) {
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 1;
        const dollarOff = Number(item.dollarOff) || 0;
        const disc = String(item.discount || '1');

        let discountedBase;
        if (disc === 'bogo') {
          discountedBase = Math.ceil(qty / 2) * price;
        } else {
          const factor = parseFloat(disc);
          discountedBase = price * qty * (isNaN(factor) ? 1 : factor);
        }

        return Math.max(0, Math.round(discountedBase - dollarOff));
      }

      function generateId() {
        return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        el.toast.textContent = message;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.toast.classList.remove('show');
        }, 1800);
      }

      /**
       * Reliably auto-selects all text on focus/tap for both iOS Safari and desktop browsers.
       */
      function enableAutoSelect(inputEl) {
        let justFocused = false;

        const selectAll = () => {
          if (document.activeElement !== inputEl) return;
          const len = inputEl.value.length;
          if (len === 0) return;
          inputEl.select();
          try {
            inputEl.setSelectionRange(0, len);
          } catch (e) {
            // Ignore if input type does not support setSelectionRange
          }
        };

        inputEl.addEventListener('focus', () => {
          justFocused = true;
          selectAll();
          requestAnimationFrame(selectAll);
          setTimeout(selectAll, 60);
        });

        const handleRelease = (e) => {
          if (justFocused) {
            e.preventDefault();
            selectAll();
            justFocused = false;
          }
        };

        inputEl.addEventListener('mouseup', handleRelease);
        inputEl.addEventListener('pointerup', handleRelease);

        inputEl.addEventListener('blur', () => {
          justFocused = false;
        });
      }

      /* =========================================
         LocalStorage Persistence
         ========================================= */
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state.items = Array.isArray(parsed.items)
              ? parsed.items.map(it => ({
                  id: it.id || generateId(),
                  name: String(it.name || ''),
                  price: Number(it.price) || 0,
                  qty: Math.max(1, parseInt(it.qty, 10) || 1),
                  discount: DISCOUNT_LABELS.hasOwnProperty(String(it.discount || '1'))
                    ? String(it.discount || '1')
                    : '1',
                  dollarOff: Number(it.dollarOff) > 0 ? Number(it.dollarOff) : 0,
                  checked: it.checked !== false,
                  createdAt: it.createdAt || Date.now()
                }))
              : [];
            state.budget = Number(parsed.budget) > 0 ? Number(parsed.budget) : 0;
            state.flatDiscount = Number(parsed.flatDiscount) > 0 ? Number(parsed.flatDiscount) : 0;
            state.sortByChecked = Boolean(
              parsed.sortByChecked !== undefined ? parsed.sortByChecked : parsed.sinkUnchecked
            );
            state.history = parsed.history && typeof parsed.history === 'object' ? parsed.history : {};
          }
        } catch (err) {
          console.warn('讀取暫存失敗:', err);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('儲存暫存失敗:', err);
        }
      }

      function recordHistory(name, price) {
        const trimmed = name.trim();
        if (!trimmed) return;
        state.history[trimmed] = {
          price: price,
          updatedAt: Date.now()
        };
        const keys = Object.keys(state.history);
        if (keys.length > 80) {
          keys.sort((a, b) => (state.history[b].updatedAt || 0) - (state.history[a].updatedAt || 0));
          const kept = {};
          keys.slice(0, 80).forEach(k => { kept[k] = state.history[k]; });
          state.history = kept;
        }
      }

      /* =========================================
         History Autocomplete
         ========================================= */
      function renderAutocomplete() {
        const query = el.itemNameInput.value.trim().toLowerCase();
        const entries = Object.entries(state.history)
          .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

        const matches = query
          ? entries.filter(([name]) => name.toLowerCase().includes(query)).slice(0, 6)
          : entries.slice(0, 5);

        if (matches.length === 0) {
          closeAutocomplete();
          return;
        }

        if (matches.length === 1 && matches[0][0].toLowerCase() === query && el.itemPriceInput.value !== '') {
          closeAutocomplete();
          return;
        }

        el.autocompleteDropdown.innerHTML = matches.map(([name, info]) => `
          <div class="autocomplete-item" role="option" data-name="${escapeHtml(name)}" data-price="${info.price}">
            <span class="autocomplete-name">${escapeHtml(name)}</span>
            <span class="autocomplete-price">$${formatMoney(info.price)}</span>
          </div>
        `).join('');

        el.autocompleteDropdown.classList.add('open');
      }

      function closeAutocomplete() {
        el.autocompleteDropdown.classList.remove('open');
      }

      /* =========================================
         Form Add / Edit Mode
         ========================================= */
      function enterEditMode(itemId) {
        const item = state.items.find(i => i.id === itemId);
        if (!item) return;

        editingId = item.id;
        el.addActions.style.display = 'none';
        el.editActions.style.display = 'flex';

        el.itemNameInput.value = item.name;
        el.itemPriceInput.value = String(item.price);
        setQtyValue(item.qty);
        el.itemDiscountSelect.value = DISCOUNT_LABELS.hasOwnProperty(String(item.discount))
          ? String(item.discount)
          : '1';
        el.itemDollarOffInput.value = item.dollarOff > 0 ? String(item.dollarOff) : '';

        closeAutocomplete();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function exitEditMode() {
        editingId = null;
        el.addActions.style.display = 'flex';
        el.editActions.style.display = 'none';

        el.itemNameInput.value = '';
        el.itemPriceInput.value = '';
        setQtyValue(1);
        el.itemDiscountSelect.value = '1';
        el.itemDollarOffInput.value = '';

        closeAutocomplete();
        renderAll();
      }

      function handleFormSubmit(e) {
        e.preventDefault();

        const name = el.itemNameInput.value.trim();
        const priceStr = sanitizeDecimalInput(el.itemPriceInput.value);
        const price = parseFloat(priceStr);
        const qty = getQtyValue();
        const discount = el.itemDiscountSelect.value || '1';
        const dollarOffVal = parseFloat(sanitizeDecimalInput(el.itemDollarOffInput.value));
        const dollarOff = (!isNaN(dollarOffVal) && dollarOffVal > 0) ? Math.round(dollarOffVal * 100) / 100 : 0;

        if (!name) {
          showToast('請輸入品項名稱');
          el.itemNameInput.focus();
          return;
        }

        if (isNaN(price) || price < 0) {
          showToast('請輸入單價');
          el.itemPriceInput.focus();
          return;
        }

        recordHistory(name, price);

        if (editingId) {
          const target = state.items.find(i => i.id === editingId);
          if (target) {
            target.name = name;
            target.price = price;
            target.qty = qty;
            target.discount = discount;
            target.dollarOff = dollarOff;
            showToast('已更新');
          }
          saveState();
          exitEditMode();
        } else {
          // Append new items to the bottom of the list (oldest at top, newest at bottom)
          state.items.push({
            id: generateId(),
            name: name,
            price: price,
            qty: qty,
            discount: discount,
            dollarOff: dollarOff,
            checked: true,
            createdAt: Date.now()
          });
          saveState();
          exitEditMode();
          showToast(`已加入「${name}」`);
        }
      }

      /* =========================================
         Rendering
         ========================================= */
      function renderAll() {
        renderList();
        renderSummaryAndBudget();
        renderToolbar();
      }

      function renderToolbar() {
        const totalCount = state.items.length;
        const checkedCount = state.items.filter(i => i.checked).length;
        const allChecked = totalCount > 0 && checkedCount === totalCount;
        const someChecked = checkedCount > 0 && checkedCount < totalCount;

        // Master Checkbox state: checked (全不選) / indeterminate (全選) / unchecked (全選)
        el.masterSelectBtn.disabled = totalCount === 0;
        el.masterSelectBtn.classList.toggle('is-checked', allChecked);
        el.masterSelectBtn.classList.toggle('is-indeterminate', someChecked);
        el.masterSelectBtn.setAttribute(
          'aria-checked',
          allChecked ? 'true' : (someChecked ? 'mixed' : 'false')
        );
        el.masterSelectLabel.textContent = allChecked ? '全不選' : '全選';

        el.sortToggleBtn.classList.toggle('active', state.sortByChecked);
        el.sortToggleBtn.setAttribute('aria-pressed', String(state.sortByChecked));

        el.clearCheckedBtn.disabled = checkedCount === 0;
        el.clearAllBtn.disabled = totalCount === 0;
      }

      function renderSummaryAndBudget() {
        const checkedItems = state.items.filter(i => i.checked);
        const subtotalSum = checkedItems.reduce((sum, item) => sum + calcItemSubtotal(item), 0);
        const netTotal = Math.max(0, Math.round((subtotalSum - state.flatDiscount) * 100) / 100);

        // Sticky Bottom Footer
        el.footerCountText.textContent = `已選 ${checkedItems.length} 項`;
        el.grandTotalText.textContent = `$${formatMoney(netTotal)}`;

        if (document.activeElement !== el.flatDiscountInput) {
          el.flatDiscountInput.value = state.flatDiscount > 0 ? String(state.flatDiscount) : '';
        }
        el.footerDeductWrap.classList.toggle('active', state.flatDiscount > 0);

        // Top Budget Pill & Progress Bar
        el.budgetFill.classList.remove('warning', 'over');
        el.budgetRightText.classList.remove('budget-bar-over');
        el.grandTotalText.classList.remove('over-budget');

        if (state.budget > 0) {
          const pct = Math.round((netTotal / state.budget) * 100);
          const diff = Math.round((state.budget - netTotal) * 100) / 100;

          el.budgetLabelText.textContent = `預算 $${formatMoney(netTotal)} / $${formatMoney(state.budget)}`;
          el.budgetFill.style.width = `${Math.min(pct, 100)}%`;

          if (netTotal > state.budget) {
            el.budgetFill.classList.add('over');
            el.budgetRightText.textContent = `超$${formatMoney(Math.abs(diff))}`;
            el.budgetRightText.classList.add('budget-bar-over');
            el.grandTotalText.classList.add('over-budget');
          } else {
            if (pct >= 80) {
              el.budgetFill.classList.add('warning');
            }
            el.budgetRightText.textContent = `${pct}%`;
          }
        } else {
          el.budgetLabelText.textContent = '設定預算';
          el.budgetRightText.textContent = '';
          el.budgetFill.style.width = '0%';
        }
      }

      function renderList() {
        // Leave list container completely empty when there are no items
        if (state.items.length === 0) {
          el.shoppingList.innerHTML = '';
          return;
        }

        let displayItems = [...state.items];
        if (state.sortByChecked) {
          displayItems.sort((a, b) => {
            if (a.checked === b.checked) return 0;
            return a.checked ? -1 : 1;
          });
        }

        el.shoppingList.innerHTML = displayItems.map(item => {
          const subtotal = calcItemSubtotal(item);
          const discLabel = DISCOUNT_LABELS[String(item.discount)] || '';
          const badges = [];
          if (discLabel) badges.push(discLabel);
          if (item.dollarOff > 0) badges.push(`-$${formatMoney(item.dollarOff)}`);

          const rowClass = [
            'item-row',
            item.checked ? 'checked' : 'unchecked',
            item.id === editingId ? 'editing-active' : ''
          ].filter(Boolean).join(' ');

          return `
            <article class="${rowClass}" data-id="${escapeHtml(item.id)}">
              <button
                type="button"
                class="checkbox-btn"
                data-action="toggle"
                aria-label="${item.checked ? '取消勾選' : '勾選'} ${escapeHtml(item.name)}"
                aria-pressed="${item.checked}"
              >
                <span class="checkbox-visual">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--checkbox-icon)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
              </button>

              <div class="item-main" data-action="edit">
                <span class="item-name">${escapeHtml(item.name)}</span>
                ${badges.map(b => `<span class="item-badge">${escapeHtml(b)}</span>`).join('')}
              </div>

              <div class="row-stepper" data-action="stepper">
                <button
                  type="button"
                  class="row-stepper-btn"
                  data-action="dec"
                  aria-label="減少數量"
                  ${item.qty <= 1 ? 'disabled' : ''}
                >−</button>
                <span class="row-stepper-qty">${item.qty}</span>
                <button
                  type="button"
                  class="row-stepper-btn"
                  data-action="inc"
                  aria-label="增加數量"
                >+</button>
              </div>

              <span class="item-subtotal" data-action="edit">$${formatMoney(subtotal)}</span>
            </article>
          `;
        }).join('');
      }

      /* =========================================
         Modals Helpers
         ========================================= */
      function openConfirmModal(title, desc, okText, onConfirm) {
        el.confirmModalTitle.textContent = title;
        el.confirmModalDesc.textContent = desc;
        el.confirmOkBtn.textContent = okText;
        pendingConfirmCallback = onConfirm;
        el.confirmModal.classList.add('open');
      }

      function closeConfirmModal() {
        el.confirmModal.classList.remove('open');
        pendingConfirmCallback = null;
      }

      function openBudgetModal() {
        el.budgetModalInput.value = state.budget > 0 ? String(state.budget) : '';
        el.budgetModal.classList.add('open');
        setTimeout(() => el.budgetModalInput.focus(), 50);
      }

      function closeBudgetModal() {
        el.budgetModal.classList.remove('open');
      }

      /* =========================================
         Event Listeners
         ========================================= */
      function bindEvents() {
        el.itemForm.addEventListener('submit', handleFormSubmit);

        // Attach Auto-Select All on Focus/Tap for ALL Inputs
        [
          el.itemNameInput,
          el.itemPriceInput,
          el.itemQty,
          el.itemDollarOffInput,
          el.flatDiscountInput,
          el.budgetModalInput
        ].forEach(enableAutoSelect);

        // Item Name Autocomplete
        el.itemNameInput.addEventListener('input', renderAutocomplete);
        el.itemNameInput.addEventListener('focus', renderAutocomplete);

        el.autocompleteDropdown.addEventListener('click', (e) => {
          const opt = e.target.closest('.autocomplete-item');
          if (!opt) return;
          el.itemNameInput.value = opt.dataset.name || '';
          el.itemPriceInput.value = opt.dataset.price || '';
          closeAutocomplete();
        });

        document.addEventListener('click', (e) => {
          if (!el.inputPanel.contains(e.target)) {
            closeAutocomplete();
          }
        });

        // Numeric Input Sanitization
        [el.itemPriceInput, el.itemDollarOffInput, el.budgetModalInput].forEach(input => {
          input.addEventListener('input', (e) => {
            const clean = sanitizeDecimalInput(e.target.value);
            if (e.target.value !== clean) e.target.value = clean;
          });
        });

        // Quantity Control Select + ◀ ▶ Arrows
        el.itemQtySelect.addEventListener('change', syncQtyArrowState);
        // Quantity Control: Numeric Input + ▾ 1-20 Select + ◀ ▶ Arrows
        el.itemQty.addEventListener('input', (e) => {
          const clean = sanitizeIntInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
          const num = parseInt(clean, 10);
          if (!isNaN(num) && num >= 1 && num <= 20) {
            el.itemQtySelect.value = String(num);
          }
          syncQtyArrowState();
        });

        el.itemQty.addEventListener('blur', () => {
          setQtyValue(getQtyValue());
        });

        el.itemQtySelect.addEventListener('change', () => {
          setQtyValue(el.itemQtySelect.value);
        });

        el.qtyDecBtn.addEventListener('click', () => {
          const current = getQtyValue();
          if (current > 1) {
            setQtyValue(current - 1);
          }
        });

        el.qtyIncBtn.addEventListener('click', () => {
          setQtyValue(getQtyValue() + 1);
        });

        // Edit Mode Cancel
        el.cancelEditBtn.addEventListener('click', exitEditMode);

        // Shopping List Click Delegation
        el.shoppingList.addEventListener('click', (e) => {
          const row = e.target.closest('.item-row');
          if (!row) return;
          const id = row.dataset.id;
          const item = state.items.find(i => i.id === id);
          if (!item) return;

          const actionEl = e.target.closest('[data-action]');
          const action = actionEl ? actionEl.dataset.action : 'edit';

          if (action === 'toggle') {
            e.stopPropagation();
            item.checked = !item.checked;
            saveState();
            renderAll();
            return;
          }

          if (action === 'dec') {
            e.stopPropagation();
            if (item.qty > 1) {
              item.qty -= 1;
              if (editingId === item.id) {
                setQtyValue(item.qty);
              }
              saveState();
              renderAll();
            }
            return;
          }

          if (action === 'inc') {
            e.stopPropagation();
            item.qty += 1;
            if (editingId === item.id) {
              setQtyValue(item.qty);
            }
            saveState();
            renderAll();
            return;
          }

          if (action === 'stepper') {
            e.stopPropagation();
            return;
          }

          enterEditMode(id);
        });

        // Toolbar Actions
        el.masterSelectBtn.addEventListener('click', () => {
          if (state.items.length === 0) return;
          const allChecked = state.items.every(i => i.checked);
          const nextChecked = !allChecked;
          state.items.forEach(item => { item.checked = nextChecked; });
          saveState();
          renderAll();
          showToast(nextChecked ? '已全選' : '已取消全部勾選');
        });

        el.sortToggleBtn.addEventListener('click', () => {
          state.sortByChecked = !state.sortByChecked;
          saveState();
          renderAll();
        });

        el.clearCheckedBtn.addEventListener('click', () => {
          const checkedCount = state.items.filter(i => i.checked).length;
          if (checkedCount === 0) return;
          openConfirmModal(
            '刪除已勾選項目？',
            `將刪除已勾選的 ${checkedCount} 個項目，未勾選項目會保留。`,
            '刪除已勾選',
            () => {
              state.items = state.items.filter(i => !i.checked);
              if (editingId && !state.items.some(i => i.id === editingId)) {
                exitEditMode();
              }
              saveState();
              renderAll();
              showToast(`已刪除 ${checkedCount} 項`);
            }
          );
        });

        el.clearAllBtn.addEventListener('click', () => {
          if (state.items.length === 0) return;
          openConfirmModal(
            '全部刪除？',
            `將刪除全部 ${state.items.length} 個項目（歷史品項紀錄仍會保留）。`,
            '全部刪除',
            () => {
              state.items = [];
              state.flatDiscount = 0;
              if (editingId) exitEditMode();
              saveState();
              renderAll();
              showToast('已全部刪除');
            }
          );
        });

        // Sticky Footer Order Discount & Dedicated × Clear Button
        el.flatDiscountInput.addEventListener('input', (e) => {
          const clean = sanitizeDecimalInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
          const val = parseFloat(clean);
          state.flatDiscount = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
        });

        el.flatDiscountInput.addEventListener('blur', () => {
          el.flatDiscountInput.value = state.flatDiscount > 0 ? String(state.flatDiscount) : '';
        });

        el.clearFlatDiscountBtn.addEventListener('click', () => {
          state.flatDiscount = 0;
          el.flatDiscountInput.value = '';
          saveState();
          renderSummaryAndBudget();
        });

        // Budget Modal
        el.budgetBarBtn.addEventListener('click', openBudgetModal);
        el.budgetCancelBtn.addEventListener('click', closeBudgetModal);
        el.budgetModal.addEventListener('click', (e) => {
          if (e.target === el.budgetModal) closeBudgetModal();
        });

        el.budgetModal.querySelectorAll('[data-budget-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = Number(btn.dataset.budgetPreset);
            el.budgetModalInput.value = val > 0 ? String(val) : '';
          });
        });

        el.budgetSaveBtn.addEventListener('click', () => {
          const val = parseFloat(sanitizeDecimalInput(el.budgetModalInput.value));
          state.budget = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
          closeBudgetModal();
          showToast(state.budget > 0 ? `預算已設為 $${formatMoney(state.budget)}` : '已取消預算限制');
        });

        el.budgetModalInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            el.budgetSaveBtn.click();
          }
        });

        // Soft Confirm Modal
        el.confirmCancelBtn.addEventListener('click', closeConfirmModal);
        el.confirmModal.addEventListener('click', (e) => {
          if (e.target === el.confirmModal) closeConfirmModal();
        });
        el.confirmOkBtn.addEventListener('click', () => {
          if (typeof pendingConfirmCallback === 'function') {
            pendingConfirmCallback();
          }
          closeConfirmModal();
        });
      }

      /* =========================================
         Initialize
         ========================================= */
      function init() {
        populateQtySelect();
        loadState();
        bindEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
