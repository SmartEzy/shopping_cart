<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>購物車</title>

  <!-- PWA & iOS Mobile Web App Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="購物車">
  <meta name="theme-color" content="#F7F5F2">

  <!-- Home Screen & Browser Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    /* =========================================
       Soft Light Morandi Color Tokens
       ========================================= */
    :root {
      --bg-page: #F7F5F2;
      --bg-card: #FFFFFF;
      --bg-input: #FFFFFF;
      --border-divider: #EAE6DF;
      --border-input: #E6E2DA;
      --border-card: #E6E2DA;
      --border-focus: #8FA4B5;

      /* Primary Accent: Soft Misty Blue */
      --primary: #C8D6E2;
      --primary-active: #B7C8D7;
      --primary-text: #3B4954;

      /* Checkbox Fill: Misty Blue with White Checkmark */
      --checkbox-fill: #8FA4B5;
      --checkbox-border: #C8C2B8;

      /* Edit Mode Update: Soft Sage Green */
      --secondary: #C7D8CC;
      --secondary-active: #B5CBB9;
      --secondary-text: #36473B;
      --edit-highlight-bg: #F5F9F6;
      --edit-highlight-border: #A8BEA9;

      /* Neutral Controls */
      --neutral: #EAE6DF;
      --neutral-active: #DFDAD1;

      /* Delete / Over-Budget: Soft Dusty Rose */
      --danger: #E8CFCF;
      --danger-strong: #C99696;
      --danger-active: #DCBEBE;
      --danger-text: #6E4444;
      --danger-soft-bg: #F6ECEC;

      /* Progress Bar Colors */
      --prog-track: #EAE6DF;
      --prog-normal: #8FA4B5;
      --prog-warning: #D4B483;
      --prog-over: #C99696;

      /* Typography */
      --text-primary: #4A4A48;
      --text-secondary: #8C8984;

      --radius-lg: 16px;
/* ... existing code ... -->
    /* =========================================
       Bottom Sticky Footer (Solid #F7F5F2, Single Row, No Blur)
       ========================================= */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-page);
      border-top: 1px solid var(--border-divider);
      z-index: 50;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
    }

    .sticky-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    /* Left: Compact Cart-Wide Deduction Pill + × Clear Button */
    .footer-deduct {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 34px;
      padding: 0 5px 0 9px;
      border-radius: 999px;
      border: 1px solid var(--border-input);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.16s, background-color 0.16s;
    }

    .footer-deduct:focus-within {
      border-color: var(--border-focus);
    }

    .footer-deduct.active {
      background-color: var(--danger-soft-bg);
      border-color: var(--danger-strong);
      color: var(--danger-text);
    }

    .footer-deduct-input {
      width: 48px;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 13.5px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 0;
      text-align: right;
    }

    .footer-deduct-input::placeholder {
      color: #B4AFA8;
      font-weight: 500;
    }

    .footer-deduct-clear {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background-color: rgba(140, 137, 132, 0.16);
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background-color 0.14s, color 0.14s, transform 0.1s;
    }

    .footer-deduct.active .footer-deduct-clear {
      background-color: rgba(110, 68, 68, 0.15);
      color: var(--danger-text);
    }

    .footer-deduct-clear:active {
      transform: scale(0.9);
    }

    /* Center: Smart Item / Piece Count */
    .footer-count {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    /* Far Right: Prominent Grand Total */
    .footer-total-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex-shrink: 0;
      text-align: right;
    }

    .footer-total-val.over-budget {
      color: var(--danger-text);
    }

    /* =========================================
       Custom Soft Modals & Toast (No alert/confirm)
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(74, 74, 72, 0.32);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.14s ease;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: 0 12px 32px rgba(74, 74, 72, 0.16);
      animation: scaleUp 0.15s ease;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-desc {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 14px;
    }

    .preset-chip {
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border-input);
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .preset-chip:active {
      background-color: var(--primary);
      color: var(--primary-text);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background-color: rgba(74, 74, 72, 0.92);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 150;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 374px) {
      .qty-arrow-btn {
        width: 19px;
      }
      .qty-select-wrap {
        width: 17px;
      }
      .sticky-inner {
        gap: 6px;
      }
      .footer-deduct {
        padding: 0 4px 0 8px;
        font-size: 11.5px;
      }
      .footer-deduct-input {
        width: 40px;
        font-size: 13px;
      }
      .footer-count {
        font-size: 11.5px;
      }
      .footer-total-val {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Sticky Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="brand-title">購物車</h1>
      <button type="button" id="budgetPillBtn" class="budget-pill" aria-label="設定採買預算">
        <div class="budget-pill-top">
          <span id="budgetLabelText" class="budget-pill-label">設定預算</span>
          <span id="budgetStatusText" class="budget-pill-status"></span>
        </div>
        <div id="budgetTrack" class="budget-track hidden">
          <div id="budgetFill" class="budget-fill"></div>
        </div>
      </button>
    </div>
  </header>

  <div class="app-container">
    <!-- Frameless Compact 2-Row Input Area (3 Equal Columns) -->
    <section id="inputArea" class="input-area" aria-label="商品輸入區">
      <form id="itemForm" novalidate>
        <!-- Row 1: 品項名稱 | 單價 | 數量 -->
        <div class="form-grid-row">
          <div class="name-field-wrap">
            <input
              type="text"
              id="itemNameInput"
              class="field-input"
              placeholder="品項名稱"
              autocomplete="off"
              enterkeyhint="next"
              aria-label="品項名稱"
            >
            <div id="autocompleteDropdown" class="autocomplete-dropdown" role="listbox" aria-label="歷史品項建議"></div>
          </div>

          <input
            type="text"
            id="itemPriceInput"
            class="field-input field-numeric"
            inputmode="decimal"
            placeholder="單價"
            autocomplete="off"
            enterkeyhint="done"
            aria-label="單價"
          >

          <!-- Compound Qty Control: Numeric Input + ▾ 1-20 Select + ◀ ▶ Arrows -->
          <div class="qty-control">
            <input
              type="text"
              id="itemQtyInput"
              class="qty-input field-numeric"
              inputmode="numeric"
              pattern="[0-9]*"
              value="1"
              autocomplete="off"
              enterkeyhint="done"
              aria-label="數量"
            >
            <div class="qty-select-wrap" title="快速選擇數量">
              <span class="qty-select-caret" aria-hidden="true">▾</span>
              <select id="itemQtySelect" class="qty-select" aria-label="快速選擇數量">
                <option value="1" selected>1</option>
              </select>
            </div>
            <div class="qty-arrows">
              <button type="button" id="qtyDecBtn" class="qty-arrow-btn" aria-label="減少數量">◀</button>
              <button type="button" id="qtyIncBtn" class="qty-arrow-btn" aria-label="增加數量">▶</button>
            </div>
          </div>
        </div>

        <!-- Row 2: 折扣 | 折價(元) | ＋加入 (or 更新 + ✕) -->
        <div class="form-grid-row">
          <div class="select-wrap">
            <select id="itemDiscountSelect" class="field-select" aria-label="折扣">
              <option value="1">無折扣</option>
              <option value="0.95">95折</option>
              <option value="0.9">9折</option>
              <option value="0.85">85折</option>
              <option value="0.8">8折</option>
              <option value="0.75">75折</option>
              <option value="0.7">7折</option>
              <option value="0.6">6折</option>
              <option value="0.5">5折</option>
              <option value="bogo">買一送一</option>
            </select>
          </div>

          <input
            type="text"
            id="itemCouponInput"
            class="field-input field-numeric"
            inputmode="decimal"
            placeholder="折價(元)"
            autocomplete="off"
            enterkeyhint="done"
            aria-label="折價(元)"
          >

          <!-- Normal Mode -->
          <div id="addActionSlot" class="action-slot">
            <button type="submit" class="btn btn-primary">＋加入</button>
          </div>

          <!-- Edit Mode -->
          <div id="editActionSlot" class="action-slot" style="display: none;">
            <button type="submit" class="btn btn-update">更新</button>
            <button type="button" id="cancelEditBtn" class="btn btn-cancel-icon" aria-label="取消編輯" title="取消">✕</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Toolbar Row -->
    <section class="toolbar" aria-label="清單工具列">
      <div class="toolbar-left">
        <button type="button" id="masterSelectBtn" class="master-select-btn" aria-label="全選或全不選" disabled>
          <span class="checkbox-visual">
            <svg class="icon-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <svg class="icon-dash" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span id="masterSelectLabel">全選</span>
        </button>

        <button type="button" id="sortToggleBtn" class="pill-btn" aria-pressed="false">排序(依勾選)</button>
      </div>

      <div class="toolbar-right">
        <button type="button" id="clearCheckedBtn" class="pill-btn" disabled>刪除已勾選</button>
        <button type="button" id="clearAllBtn" class="pill-btn danger-pill" disabled>刪除全部</button>
      </div>
    </section>

    <!-- Single-Row Item List (Clean empty space when no items) -->
    <main id="shoppingList" class="shopping-list" aria-live="polite"></main>
  </div>

  <!-- Bottom Sticky Footer -->
  <footer class="sticky-footer" aria-label="總計列">
    <div class="sticky-inner">
      <div class="footer-left">
        <div id="footerDeductWrap" class="footer-deduct">
  <!-- Bottom Sticky Footer (Single Row) -->
  <footer class="sticky-footer" aria-label="總計列">
    <div class="sticky-inner">
      <div id="footerDeductWrap" class="footer-deduct">
        <label for="cartDiscountInput">折抵</label>
        <input
          type="text"
          id="cartDiscountInput"
          class="footer-deduct-input"
          inputmode="decimal"
          placeholder="0"
          autocomplete="off"
          aria-label="滿額折抵金額"
        >
        <button
          type="button"
          id="clearCartDiscountBtn"
          class="footer-deduct-clear"
          aria-label="清除滿額折抵"
          title="清除滿額折抵"
        >×</button>
      </div>

      <span id="footerCountText" class="footer-count">已選 0 項</span>

      <span id="grandTotalText" class="footer-total-val">$0</span>
    </div>
  </footer>

  <!-- Custom Budget Modal -->
  <div id="budgetModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="budgetModalTitle">
    <div class="modal-card">
      <h2 id="budgetModalTitle" class="modal-title">設定預算</h2>
      <p class="modal-desc">輸入本次採買預算上限，留空或輸入 0 即可取消限制。</p>
      <input
        type="text"
        id="budgetModalInput"
        class="field-input field-numeric"
        inputmode="decimal"
        placeholder="預算金額"
        autocomplete="off"
      >
      <div class="preset-chips">
        <button type="button" class="preset-chip" data-budget-preset="500">$500</button>
        <button type="button" class="preset-chip" data-budget-preset="1000">$1,000</button>
        <button type="button" class="preset-chip" data-budget-preset="2000">$2,000</button>
        <button type="button" class="preset-chip" data-budget-preset="3000">$3,000</button>
        <button type="button" class="preset-chip" data-budget-preset="0">清除預算</button>
      </div>
      <div class="modal-actions">
        <button type="button" id="budgetCancelBtn" class="btn btn-modal-neutral">取消</button>
        <button type="button" id="budgetSaveBtn" class="btn btn-primary" style="flex: 1;">儲存</button>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-card">
      <h2 id="confirmModalTitle" class="modal-title">確認刪除</h2>
      <p id="confirmModalDesc" class="modal-desc"></p>
      <div class="modal-actions">
        <button type="button" id="confirmCancelBtn" class="btn btn-modal-neutral">取消</button>
        <button type="button" id="confirmOkBtn" class="btn btn-modal-danger">確認</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      /* =========================================
         Constants & State
         ========================================= */
      const STORAGE_KEY = 'morandi_supermarket_cart_v1';

      const DISCOUNT_LABELS = {
        '1': '',
        '0.95': '95折',
        '0.9': '9折',
        '0.85': '85折',
        '0.8': '8折',
        '0.75': '75折',
        '0.7': '7折',
        '0.6': '6折',
        '0.5': '5折',
        'bogo': '買一送一'
      };

      const state = {
        items: [],
        history: {},       // { [name]: { price: number, updatedAt: number } }
        budget: 0,
        cartDiscount: 0,
        sortByChecked: false
      };

      let editingId = null;
      let pendingConfirmCallback = null;
      let toastTimer = null;

      /* =========================================
         DOM References
         ========================================= */
      const el = {
        budgetPillBtn: document.getElementById('budgetPillBtn'),
        budgetLabelText: document.getElementById('budgetLabelText'),
        budgetStatusText: document.getElementById('budgetStatusText'),
        budgetTrack: document.getElementById('budgetTrack'),
        budgetFill: document.getElementById('budgetFill'),

        inputArea: document.getElementById('inputArea'),
        itemForm: document.getElementById('itemForm'),
        itemNameInput: document.getElementById('itemNameInput'),
        autocompleteDropdown: document.getElementById('autocompleteDropdown'),
        itemPriceInput: document.getElementById('itemPriceInput'),
        itemQtyInput: document.getElementById('itemQtyInput'),
        itemQtySelect: document.getElementById('itemQtySelect'),
        qtyDecBtn: document.getElementById('qtyDecBtn'),
        qtyIncBtn: document.getElementById('qtyIncBtn'),
        itemDiscountSelect: document.getElementById('itemDiscountSelect'),
        itemCouponInput: document.getElementById('itemCouponInput'),

        addActionSlot: document.getElementById('addActionSlot'),
        editActionSlot: document.getElementById('editActionSlot'),
        cancelEditBtn: document.getElementById('cancelEditBtn'),

        masterSelectBtn: document.getElementById('masterSelectBtn'),
        masterSelectLabel: document.getElementById('masterSelectLabel'),
        sortToggleBtn: document.getElementById('sortToggleBtn'),
        clearCheckedBtn: document.getElementById('clearCheckedBtn'),
        clearAllBtn: document.getElementById('clearAllBtn'),
        shoppingList: document.getElementById('shoppingList'),

        footerCountText: document.getElementById('footerCountText'),
        footerDeductWrap: document.getElementById('footerDeductWrap'),
        cartDiscountInput: document.getElementById('cartDiscountInput'),
        clearCartDiscountBtn: document.getElementById('clearCartDiscountBtn'),
        grandTotalText: document.getElementById('grandTotalText'),

        budgetModal: document.getElementById('budgetModal'),
        budgetModalInput: document.getElementById('budgetModalInput'),
        budgetCancelBtn: document.getElementById('budgetCancelBtn'),
        budgetSaveBtn: document.getElementById('budgetSaveBtn'),

        confirmModal: document.getElementById('confirmModal'),
        confirmModalTitle: document.getElementById('confirmModalTitle'),
        confirmModalDesc: document.getElementById('confirmModalDesc'),
        confirmCancelBtn: document.getElementById('confirmCancelBtn'),
        confirmOkBtn: document.getElementById('confirmOkBtn'),

        toast: document.getElementById('toast')
      };

      /* =========================================
         Utility Helpers
         ========================================= */
      function populateQtySelect() {
        el.itemQtySelect.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = String(i);
          if (i === 1) opt.selected = true;
          el.itemQtySelect.appendChild(opt);
        }
        setQtyValue(1);
      }

      function sanitizeIntInput(raw) {
        return String(raw)
          .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/[^0-9]/g, '');
      }

      function sanitizeDecimalInput(raw) {
        let str = String(raw)
          .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/．/g, '.')
          .replace(/[^0-9.]/g, '');

        const parts = str.split('.');
        if (parts.length > 2) {
          str = parts[0] + '.' + parts.slice(1).join('');
        }
        if (parts[1] && parts[1].length > 2) {
          str = parts[0] + '.' + parts[1].slice(0, 2);
        }
        return str;
      }

      function getQtyValue() {
        const parsed = parseInt(sanitizeIntInput(el.itemQtyInput.value), 10);
        return (!isNaN(parsed) && parsed >= 1) ? parsed : 1;
      }

      function setQtyValue(val) {
        const safe = Math.max(1, parseInt(val, 10) || 1);
        el.itemQtyInput.value = String(safe);
        if (safe >= 1 && safe <= 20) {
          el.itemQtySelect.value = String(safe);
        }
        el.qtyDecBtn.disabled = safe <= 1;
      }

      function formatIntMoney(amount) {
        const rounded = Math.max(0, Math.round(Number(amount) || 0));
        return rounded.toLocaleString('zh-TW');
      }

      function formatPriceDisplay(amount) {
        const num = Math.round((Number(amount) || 0) * 100) / 100;
        const isInt = Math.abs(num - Math.round(num)) < 0.001;
        return num.toLocaleString('zh-TW', {
          minimumFractionDigits: isInt ? 0 : 1,
          maximumFractionDigits: 2
        });
      }

      /**
       * Calculates item subtotal: percentage/BOGO discount first, then coupon deduction, rounded to integer (min 0).
       */
      function calcItemSubtotal(item) {
        const price = Number(item.price) || 0;
        const qty = Math.max(1, parseInt(item.qty, 10) || 1);
        const coupon = Number(item.dollarOff) || 0;
        const disc = String(item.discount || '1');

        let discountedBase;
        if (disc === 'bogo') {
          discountedBase = Math.ceil(qty / 2) * price;
        } else {
          const factor = parseFloat(disc);
          discountedBase = price * qty * (isNaN(factor) ? 1 : factor);
        }

        return Math.max(0, Math.round(discountedBase - coupon));
      }

      function generateId() {
        return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        el.toast.textContent = message;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.toast.classList.remove('show');
        }, 1800);
      }

      /**
       * Reliably auto-selects all text on focus for both iOS Safari and desktop browsers.
       */
      function enableAutoSelect(inputEl) {
        let justFocused = false;

        const selectAll = () => {
          if (document.activeElement !== inputEl) return;
          const len = inputEl.value.length;
          if (len === 0) return;
          inputEl.select();
          try {
            inputEl.setSelectionRange(0, len);
          } catch (err) {
            // Safe fallback if browser restricts selection range
          }
        };

        inputEl.addEventListener('focus', () => {
          justFocused = true;
          selectAll();
          requestAnimationFrame(selectAll);
          setTimeout(selectAll, 40);
        });

        const preventClearOnInitialRelease = (e) => {
          if (justFocused) {
            e.preventDefault();
            selectAll();
            justFocused = false;
          }
        };

        inputEl.addEventListener('mouseup', preventClearOnInitialRelease);
        inputEl.addEventListener('pointerup', preventClearOnInitialRelease);

        inputEl.addEventListener('blur', () => {
          justFocused = false;
        });
      }

      /* =========================================
         LocalStorage Persistence
         ========================================= */
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return;

          state.items = Array.isArray(parsed.items)
            ? parsed.items.map(it => ({
                id: it.id || generateId(),
                name: String(it.name || ''),
                price: Number(it.price) || 0,
                qty: Math.max(1, parseInt(it.qty, 10) || 1),
                discount: Object.prototype.hasOwnProperty.call(DISCOUNT_LABELS, String(it.discount || '1'))
                  ? String(it.discount || '1')
                  : '1',
                dollarOff: Number(it.dollarOff) > 0 ? Number(it.dollarOff) : 0,
                checked: it.checked !== false,
                createdAt: it.createdAt || Date.now()
              }))
            : [];

          state.budget = Number(parsed.budget) > 0 ? Number(parsed.budget) : 0;

          const storedDiscount = parsed.cartDiscount !== undefined
            ? parsed.cartDiscount
            : parsed.flatDiscount;
          state.cartDiscount = Number(storedDiscount) > 0 ? Number(storedDiscount) : 0;

          state.sortByChecked = Boolean(
            parsed.sortByChecked !== undefined ? parsed.sortByChecked : parsed.sinkUnchecked
          );

          state.history = (parsed.history && typeof parsed.history === 'object') ? parsed.history : {};
        } catch (err) {
          console.warn('讀取暫存資料失敗:', err);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('儲存暫存資料失敗:', err);
        }
      }

      function recordHistory(name, price) {
        const trimmed = name.trim();
        if (!trimmed) return;
        state.history[trimmed] = {
          price: price,
          updatedAt: Date.now()
        };
        const keys = Object.keys(state.history);
        if (keys.length > 80) {
          keys.sort((a, b) => (state.history[b].updatedAt || 0) - (state.history[a].updatedAt || 0));
          const trimmedHistory = {};
          keys.slice(0, 80).forEach(k => { trimmedHistory[k] = state.history[k]; });
          state.history = trimmedHistory;
        }
      }

      /* =========================================
         History Autocomplete
         ========================================= */
      function renderAutocomplete() {
        const query = el.itemNameInput.value.trim().toLowerCase();
        const entries = Object.entries(state.history)
          .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

        const matches = query
          ? entries.filter(([name]) => name.toLowerCase().includes(query)).slice(0, 6)
          : entries.slice(0, 5);

        if (matches.length === 0) {
          closeAutocomplete();
          return;
        }

        if (matches.length === 1 && matches[0][0].toLowerCase() === query && el.itemPriceInput.value !== '') {
          closeAutocomplete();
          return;
        }

        el.autocompleteDropdown.innerHTML = matches.map(([name, info]) => `
          <div class="autocomplete-item" role="option" data-name="${escapeHtml(name)}" data-price="${info.price}">
            <span class="autocomplete-name">${escapeHtml(name)}</span>
            <span class="autocomplete-price">$${formatPriceDisplay(info.price)}</span>
          </div>
        `).join('');

        el.autocompleteDropdown.classList.add('open');
      }

      function closeAutocomplete() {
        el.autocompleteDropdown.classList.remove('open');
      }

      /* =========================================
         Add / Edit Mode Management
         ========================================= */
      function enterEditMode(itemId) {
        const item = state.items.find(i => i.id === itemId);
        if (!item) return;

        editingId = item.id;
        el.addActionSlot.style.display = 'none';
        el.editActionSlot.style.display = 'flex';

        el.itemNameInput.value = item.name;
        el.itemPriceInput.value = String(item.price);
        setQtyValue(item.qty);
        el.itemDiscountSelect.value = Object.prototype.hasOwnProperty.call(DISCOUNT_LABELS, String(item.discount))
          ? String(item.discount)
          : '1';
        el.itemCouponInput.value = item.dollarOff > 0 ? String(item.dollarOff) : '';

        closeAutocomplete();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function resetFormToDefault() {
        editingId = null;
        el.addActionSlot.style.display = 'flex';
        el.editActionSlot.style.display = 'none';

        el.itemNameInput.value = '';
        el.itemPriceInput.value = '';
        setQtyValue(1);
        el.itemDiscountSelect.value = '1';
        el.itemCouponInput.value = '';

        closeAutocomplete();
        renderAll();
      }

      function handleFormSubmit(e) {
        e.preventDefault();

        const name = el.itemNameInput.value.trim();
        const priceStr = sanitizeDecimalInput(el.itemPriceInput.value);
        const price = parseFloat(priceStr);
        const qty = getQtyValue();
        const discount = el.itemDiscountSelect.value || '1';
        const couponVal = parseFloat(sanitizeDecimalInput(el.itemCouponInput.value));
        const dollarOff = (!isNaN(couponVal) && couponVal > 0) ? Math.round(couponVal * 100) / 100 : 0;

        if (!name) {
          showToast('請輸入品項名稱');
          el.itemNameInput.focus();
          return;
        }

        if (isNaN(price) || price < 0) {
          showToast('請輸入單價');
          el.itemPriceInput.focus();
          return;
        }

        recordHistory(name, price);

        if (editingId) {
          const target = state.items.find(i => i.id === editingId);
          if (target) {
            target.name = name;
            target.price = price;
            target.qty = qty;
            target.discount = discount;
            target.dollarOff = dollarOff;
            showToast('已更新');
          }
          saveState();
          resetFormToDefault();
        } else {
          // Append newly added item to the bottom of the list
          state.items.push({
            id: generateId(),
            name: name,
            price: price,
            qty: qty,
            discount: discount,
            dollarOff: dollarOff,
            checked: true,
            createdAt: Date.now()
          });
          saveState();
          resetFormToDefault();
          showToast(`已加入「${name}」`);
        }
      }

      /* =========================================
         Rendering
         ========================================= */
      function renderAll() {
        renderList();
        renderSummaryAndBudget();
        renderToolbar();
      }

      function renderToolbar() {
        const totalCount = state.items.length;
        const checkedCount = state.items.filter(i => i.checked).length;
        const allChecked = totalCount > 0 && checkedCount === totalCount;
        const someChecked = checkedCount > 0 && checkedCount < totalCount;

        el.masterSelectBtn.disabled = totalCount === 0;
        el.masterSelectBtn.classList.toggle('is-checked', allChecked);
        el.masterSelectBtn.classList.toggle('is-indeterminate', someChecked);
        el.masterSelectBtn.setAttribute(
          'aria-checked',
          allChecked ? 'true' : (someChecked ? 'mixed' : 'false')
        );
        el.masterSelectLabel.textContent = allChecked ? '全不選' : '全選';

        el.sortToggleBtn.classList.toggle('active', state.sortByChecked);
        el.sortToggleBtn.setAttribute('aria-pressed', String(state.sortByChecked));

        el.clearCheckedBtn.disabled = checkedCount === 0;
        el.clearAllBtn.disabled = totalCount === 0;
      }

      function renderSummaryAndBudget() {
        const checkedItems = state.items.filter(i => i.checked);
        const totalQty = checkedItems.reduce((sum, item) => sum + (parseInt(item.qty, 10) || 1), 0);
        const hasMultiQty = checkedItems.some(item => (parseInt(item.qty, 10) || 1) > 1);
        const subtotalSum = checkedItems.reduce((sum, item) => sum + calcItemSubtotal(item), 0);
        const netTotal = Math.max(0, Math.round(subtotalSum - state.cartDiscount));

        // Bottom Sticky Footer (Single Row): simplify to "已選 X 項" unless any checked item qty > 1
        el.footerCountText.textContent = hasMultiQty
          ? `已選 ${checkedItems.length} 項・共 ${totalQty} 件`
          : `已選 ${checkedItems.length} 項`;
        el.grandTotalText.textContent = `$${formatIntMoney(netTotal)}`;

        if (document.activeElement !== el.cartDiscountInput) {
          el.cartDiscountInput.value = state.cartDiscount > 0 ? String(state.cartDiscount) : '';
        }
        el.footerDeductWrap.classList.toggle('active', state.cartDiscount > 0);

        // Top Budget Pill & Progress Bar (<80% misty blue, >=80% warm ochre, >100% dusty rose)
        el.budgetFill.classList.remove('warning', 'over');
        el.budgetStatusText.classList.remove('over');
        el.grandTotalText.classList.remove('over-budget');

        if (state.budget > 0) {
          const rawRatio = (netTotal / state.budget) * 100;
          const pct = Math.round(rawRatio);

          el.budgetTrack.classList.remove('hidden');
          el.budgetLabelText.textContent = `$${formatIntMoney(netTotal)} / $${formatPriceDisplay(state.budget)}`;
          el.budgetFill.style.width = `${Math.min(rawRatio, 100)}%`;

          if (netTotal > state.budget) {
            el.budgetFill.classList.add('over');
            el.budgetStatusText.textContent = `超$${formatIntMoney(netTotal - state.budget)}`;
            el.budgetStatusText.classList.add('over');
            el.grandTotalText.classList.add('over-budget');
          } else {
            if (rawRatio >= 80) {
              el.budgetFill.classList.add('warning');
            }
            el.budgetStatusText.textContent = `${pct}%`;
          }
        } else {
          el.budgetTrack.classList.add('hidden');
          el.budgetLabelText.textContent = '設定預算';
          el.budgetStatusText.textContent = '';
          el.budgetFill.style.width = '0%';
        }
      }

      function renderList() {
        // Keep clean empty space when there are no items
        if (state.items.length === 0) {
          el.shoppingList.innerHTML = '';
          return;
        }

        const displayItems = [...state.items];
        if (state.sortByChecked) {
          displayItems.sort((a, b) => {
            if (a.checked === b.checked) return 0;
            return a.checked ? -1 : 1;
          });
        }

        el.shoppingList.innerHTML = displayItems.map(item => {
          const subtotal = calcItemSubtotal(item);
          const discLabel = DISCOUNT_LABELS[String(item.discount)] || '';
          const badges = [];
          if (discLabel) badges.push(discLabel);
          if (item.dollarOff > 0) badges.push(`-$${formatPriceDisplay(item.dollarOff)}`);

          const rowClass = [
            'item-row',
            item.checked ? 'checked' : 'unchecked',
            item.id === editingId ? 'editing-active' : ''
          ].filter(Boolean).join(' ');

          return `
            <article class="${rowClass}" data-id="${escapeHtml(item.id)}">
              <button
                type="button"
                class="checkbox-btn"
                data-action="toggle"
                aria-label="${item.checked ? '取消勾選' : '勾選'} ${escapeHtml(item.name)}"
                aria-pressed="${item.checked}"
              >
                <span class="checkbox-visual">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
              </button>

              <div class="item-info" data-action="edit">
                <span class="item-name">${escapeHtml(item.name)}</span>
                ${badges.map(b => `<span class="item-badge">${escapeHtml(b)}</span>`).join('')}
              </div>

              <div class="row-stepper" data-action="stepper">
                <button
                  type="button"
                  class="row-stepper-btn"
                  data-action="dec"
                  aria-label="減少數量"
                  ${item.qty <= 1 ? 'disabled' : ''}
                >−</button>
                <span class="row-stepper-qty">${item.qty}</span>
                <button
                  type="button"
                  class="row-stepper-btn"
                  data-action="inc"
                  aria-label="增加數量"
                >+</button>
              </div>

              <span class="item-subtotal" data-action="edit">$${formatIntMoney(subtotal)}</span>

              <button
                type="button"
                class="row-delete-btn"
                data-action="delete"
                aria-label="刪除 ${escapeHtml(item.name)}"
                title="刪除"
              >×</button>
            </article>
          `;
        }).join('');
      }

      /* =========================================
         Custom Modals
         ========================================= */
      function openConfirmModal(title, desc, okText, onConfirm) {
        el.confirmModalTitle.textContent = title;
        el.confirmModalDesc.textContent = desc;
        el.confirmOkBtn.textContent = okText;
        pendingConfirmCallback = onConfirm;
        el.confirmModal.classList.add('open');
      }

      function closeConfirmModal() {
        el.confirmModal.classList.remove('open');
        pendingConfirmCallback = null;
      }

      function openBudgetModal() {
        el.budgetModalInput.value = state.budget > 0 ? String(state.budget) : '';
        el.budgetModal.classList.add('open');
        setTimeout(() => el.budgetModalInput.focus(), 40);
      }

      function closeBudgetModal() {
        el.budgetModal.classList.remove('open');
      }

      /* =========================================
         Event Bindings
         ========================================= */
      function bindEvents() {
        el.itemForm.addEventListener('submit', handleFormSubmit);

        // Auto-select all text on focus for every input
        [
          el.itemNameInput,
          el.itemPriceInput,
          el.itemQtyInput,
          el.itemCouponInput,
          el.cartDiscountInput,
          el.budgetModalInput
        ].forEach(enableAutoSelect);

        // History Autocomplete
        el.itemNameInput.addEventListener('input', renderAutocomplete);
        el.itemNameInput.addEventListener('focus', renderAutocomplete);

        el.autocompleteDropdown.addEventListener('click', (e) => {
          const opt = e.target.closest('.autocomplete-item');
          if (!opt) return;
          el.itemNameInput.value = opt.dataset.name || '';
          el.itemPriceInput.value = opt.dataset.price || '';
          closeAutocomplete();
        });

        document.addEventListener('click', (e) => {
          if (!el.inputArea.contains(e.target)) {
            closeAutocomplete();
          }
        });

        // Decimal sanitization
        [el.itemPriceInput, el.itemCouponInput, el.budgetModalInput].forEach(input => {
          input.addEventListener('input', (e) => {
            const clean = sanitizeDecimalInput(e.target.value);
            if (e.target.value !== clean) e.target.value = clean;
          });
        });

        // Compound Qty Control Events
        el.itemQtyInput.addEventListener('input', (e) => {
          const clean = sanitizeIntInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
          const num = parseInt(clean, 10);
          if (!isNaN(num) && num >= 1 && num <= 20) {
            el.itemQtySelect.value = String(num);
          }
          el.qtyDecBtn.disabled = getQtyValue() <= 1;
        });

        el.itemQtyInput.addEventListener('blur', () => {
          setQtyValue(getQtyValue());
        });

        el.itemQtySelect.addEventListener('change', () => {
          setQtyValue(el.itemQtySelect.value);
        });

        el.qtyDecBtn.addEventListener('click', () => {
          const current = getQtyValue();
          if (current > 1) setQtyValue(current - 1);
        });

        el.qtyIncBtn.addEventListener('click', () => {
          setQtyValue(getQtyValue() + 1);
        });

        // Cancel Edit
        el.cancelEditBtn.addEventListener('click', resetFormToDefault);

        // Shopping List Delegation
        el.shoppingList.addEventListener('click', (e) => {
          const row = e.target.closest('.item-row');
          if (!row) return;
          const id = row.dataset.id;
          const item = state.items.find(i => i.id === id);
          if (!item) return;

          const actionEl = e.target.closest('[data-action]');
          const action = actionEl ? actionEl.dataset.action : 'edit';

          if (action === 'toggle') {
            e.stopPropagation();
            item.checked = !item.checked;
            saveState();
            renderAll();
            return;
          }

          if (action === 'dec') {
            e.stopPropagation();
            if (item.qty > 1) {
              item.qty -= 1;
              if (editingId === item.id) setQtyValue(item.qty);
              saveState();
              renderAll();
            }
            return;
          }

          if (action === 'inc') {
            e.stopPropagation();
            item.qty += 1;
            if (editingId === item.id) setQtyValue(item.qty);
            saveState();
            renderAll();
            return;
          }

          if (action === 'stepper') {
            e.stopPropagation();
            return;
          }

          if (action === 'delete') {
            e.stopPropagation();
            const removedName = item.name;
            state.items = state.items.filter(i => i.id !== id);
            if (editingId === id) {
              resetFormToDefault();
            }
            saveState();
            renderAll();
            showToast(`已刪除「${removedName}」`);
            return;
          }

          enterEditMode(id);
        });

        // Toolbar Actions
        el.masterSelectBtn.addEventListener('click', () => {
          if (state.items.length === 0) return;
          const allChecked = state.items.every(i => i.checked);
          const nextChecked = !allChecked;
          state.items.forEach(item => { item.checked = nextChecked; });
          saveState();
          renderAll();
          showToast(nextChecked ? '已全選' : '已取消全部勾選');
        });

        el.sortToggleBtn.addEventListener('click', () => {
          state.sortByChecked = !state.sortByChecked;
          saveState();
          renderAll();
        });

        el.clearCheckedBtn.addEventListener('click', () => {
          const checkedCount = state.items.filter(i => i.checked).length;
          if (checkedCount === 0) return;
          openConfirmModal(
            '刪除已勾選項目？',
            `將刪除已勾選的 ${checkedCount} 個項目，未勾選項目會保留。`,
            '刪除已勾選',
            () => {
              state.items = state.items.filter(i => !i.checked);
              if (editingId && !state.items.some(i => i.id === editingId)) {
                resetFormToDefault();
              }
              saveState();
              renderAll();
              showToast(`已刪除 ${checkedCount} 項`);
            }
          );
        });

        el.clearAllBtn.addEventListener('click', () => {
          if (state.items.length === 0) return;
          openConfirmModal(
            '刪除全部？',
            `將刪除全部 ${state.items.length} 個項目（歷史品項紀錄仍會保留）。`,
            '刪除全部',
            () => {
              state.items = [];
              state.cartDiscount = 0;
              if (editingId) resetFormToDefault();
              saveState();
              renderAll();
              showToast('已刪除全部');
            }
          );
        });

        // Bottom Sticky Footer Cart Discount & × Clear Button
        el.cartDiscountInput.addEventListener('input', (e) => {
          const clean = sanitizeDecimalInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
          const val = parseFloat(clean);
          state.cartDiscount = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
        });

        el.cartDiscountInput.addEventListener('blur', () => {
          el.cartDiscountInput.value = state.cartDiscount > 0 ? String(state.cartDiscount) : '';
        });

        el.clearCartDiscountBtn.addEventListener('click', () => {
          state.cartDiscount = 0;
          el.cartDiscountInput.value = '';
          saveState();
          renderSummaryAndBudget();
        });

        // Budget Modal
        el.budgetPillBtn.addEventListener('click', openBudgetModal);
        el.budgetCancelBtn.addEventListener('click', closeBudgetModal);
        el.budgetModal.addEventListener('click', (e) => {
          if (e.target === el.budgetModal) closeBudgetModal();
        });

        el.budgetModal.querySelectorAll('[data-budget-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = Number(btn.dataset.budgetPreset);
            el.budgetModalInput.value = val > 0 ? String(val) : '';
          });
        });

        el.budgetSaveBtn.addEventListener('click', () => {
          const val = parseFloat(sanitizeDecimalInput(el.budgetModalInput.value));
          state.budget = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
          closeBudgetModal();
          showToast(state.budget > 0 ? `預算已設為 $${formatPriceDisplay(state.budget)}` : '已取消預算限制');
        });

        el.budgetModalInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            el.budgetSaveBtn.click();
          }
        });

        // Confirm Modal
        el.confirmCancelBtn.addEventListener('click', closeConfirmModal);
        el.confirmModal.addEventListener('click', (e) => {
          if (e.target === el.confirmModal) closeConfirmModal();
        });
        el.confirmOkBtn.addEventListener('click', () => {
          if (typeof pendingConfirmCallback === 'function') {
            pendingConfirmCallback();
          }
          closeConfirmModal();
        });
      }

      /* =========================================
         Initialize Application
         ========================================= */
      function init() {
        populateQtySelect();
        loadState();
        bindEvents();
        renderAll();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
