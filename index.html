<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>賣場購物車</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="賣場購物車">
  <meta name="theme-color" content="#F4F2EE">

  <!-- iOS Home Screen & Browser Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    /* =========================================
       Morandi Color Tokens & Base Reset
       ========================================= */
    :root {
      --bg-page: #F4F2EE;
      --bg-card: #FFFFFF;
      --bg-input: #F7F5F2;
      --border-subtle: #E5E1DA;
      --primary: #7B8FA1;
      --primary-hover: #697D8F;
      --primary-soft: rgba(123, 143, 161, 0.13);
      --secondary: #8FA395;
      --secondary-hover: #7D9183;
      --secondary-soft: rgba(143, 163, 149, 0.16);
      --warning: #C9A97E;
      --warning-soft: rgba(201, 169, 126, 0.18);
      --danger: #C48F8F;
      --danger-hover: #B37D7D;
      --danger-soft: rgba(196, 143, 143, 0.16);
      --text-primary: #4A4A48;
      --text-secondary: #8C8A84;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-card: 0 4px 16px rgba(74, 74, 72, 0.045);
      --shadow-sticky: 0 -6px 24px rgba(74, 74, 72, 0.07);
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(136px + env(safe-area-inset-bottom));
    }

    /* =========================================
       Top Header & Budget Progress Bar
       ========================================= */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background-color: var(--primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(123, 143, 161, 0.25);
    }

    .brand-title {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .budget-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.12s, border-color 0.2s;
      font-family: inherit;
    }

    .budget-btn:active {
      transform: scale(0.96);
    }

    .budget-btn.has-budget {
      border-color: rgba(143, 163, 149, 0.5);
      background-color: #FFFFFF;
    }

    /* Budget Progress Card */
    .budget-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      display: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .budget-card:active {
      border-color: var(--primary);
    }

    .input-panel.editing .text-input:focus,
    .input-panel.editing .select-input:focus {
      border-color: var(--secondary);
    }

    .input-with-prefix {
      padding-left: 30px;
      font-variant-numeric: tabular-nums;
    }

    .input-prefix {
      position: absolute;
      left: 13px;
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
    }

    .clear-input-btn {
      position: absolute;
      right: 8px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-input-btn.visible {
      display: flex;
    }

    /* Custom Select Chevron */
    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--text-secondary);
      border-bottom: 2px solid var(--text-secondary);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .select-input {
      padding-right: 30px;
      cursor: pointer;
    }

    /* 3-Column Input Grid for Price / Qty / Discount */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr 1.15fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* Historical Autocomplete Dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 28px rgba(74, 74, 72, 0.12);
      z-index: 40;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-dropdown.open {
      display: block;
    }

    .autocomplete-header {
      padding: 8px 14px 4px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      background-color: #FAF9F7;
      border-bottom: 1px solid #F0EDE8;
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid #F4F2EE;
      transition: background-color 0.15s;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item:active {
      background-color: var(--bg-input);
    }

    .autocomplete-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .autocomplete-price {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      min-height: 48px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.12s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
      flex: 1;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: #FFFFFF;
      flex: 2;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-neutral {
      background-color: #ECE9E2;
      color: var(--text-primary);
      flex: 1;
    }

    .btn-neutral:hover {
      background-color: #E2DED5;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #FFFFFF;
      flex: 1;
    }

    .btn-danger:hover {
      background-color: var(--danger-hover);
    }

    /* =========================================
       List Controls Bar
       ========================================= */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .count-summary {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .controls-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .chip-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .chip-btn.danger-outline {
      color: #A86C6C;
      border-color: rgba(196, 143, 143, 0.45);
    }

    .chip-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================
       Shopping List & Item Cards
       ========================================= */
    .shopping-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 12px 12px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-card);
      transition: opacity 0.22s ease, border-color 0.22s ease, transform 0.15s ease, background-color 0.2s;
      cursor: pointer;
    }

    .item-card.unchecked {
      opacity: 0.52;
      background-color: #FAF9F7;
    }

    .item-card.editing-active {
      border-color: var(--secondary);
      background-color: #F9FBF9;
      opacity: 1;
    }

    /* Large Touch Target Checkbox */
    .checkbox-hit {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }

    .checkbox-box {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid #C8C3BA;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .item-card.checked .checkbox-box {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .checkbox-box svg {
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.15s, transform 0.15s;
    }

    .item-card.checked .checkbox-box svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Center Info */
    .item-info {
      flex: 1;
      min-width: 0;
      padding: 2px 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .item-name {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-word;
    }

    .discount-tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--warning-soft);
      color: #9A7746;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .item-meta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-calc {
      font-size: 13.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .item-subtotal {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .item-orig-subtotal {
      font-size: 12px;
      color: #ACA8A1;
      text-decoration: line-through;
      margin-right: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Right Side Inline Quantity Stepper */
    .stepper {
      display: flex;
      align-items: center;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 2px;
      flex-shrink: 0;
    }

    .stepper-btn {
      width: 34px;
      height: 36px;
      border: none;
      background-color: transparent;
      color: var(--text-primary);
      font-size: 19px;
      font-weight: 600;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .stepper-btn:active {
      background-color: #E7E3DC;
    }

    .stepper-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .stepper-val {
      min-width: 24px;
      text-align: center;
      font-size: 14.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 46px 20px;
      background-color: rgba(255, 255, 255, 0.65);
      border: 1.5px dashed var(--border-subtle);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background-color: #ECE9E2;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 6px;
    }

    .empty-desc {
      font-size: 13.5px;
      margin: 0;
    }

    /* =========================================
       Sticky Bottom Summary Bar
       ========================================= */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sticky);
      z-index: 50;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .sticky-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .selected-count-label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .deduction-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .deduction-inline:focus-within {
      background-color: #FFFFFF;
      border-color: var(--primary);
    }

    .deduction-inline.active {
      background-color: var(--danger-soft);
      border-color: rgba(196, 143, 143, 0.55);
      color: #A66969;
    }

    .deduction-input {
      width: 64px;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 0;
      text-align: left;
    }

    .deduction-input::placeholder {
      color: #ACA8A1;
      font-weight: 500;
    }

    .footer-right {
      text-align: right;
    }

    .total-label {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 1px;
    }

    .grand-total {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .grand-total.over-budget {
      color: #B47171;
    }

    /* =========================================
       Custom Morandi Modals & Toast
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(74, 74, 72, 0.36);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 16px 40px rgba(74, 74, 72, 0.18);
      animation: scaleUp 0.2s ease;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-desc {
      margin: 0 0 16px;
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 16px;
    }

    .preset-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .preset-chip:active {
      background-color: var(--primary-soft);
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background-color: #4A4A48;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 150;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments for very narrow screens */
    @media (max-width: 360px) {
      .metrics-grid {
        grid-template-columns: 1fr 1fr;
      }
      .metrics-grid .form-group:last-child {
        grid-column: span 2;
      }
      .grand-total {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </div>
        <h1 class="brand-title">賣場購物車</h1>
      </div>

      <button type="button" id="budgetBtn" class="budget-btn" aria-label="設定採買預算">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <span id="budgetBtnText">設定預算</span>
      </button>
    </header>

    <!-- Budget Progress Bar -->
    <section id="budgetCard" class="budget-card" aria-live="polite">
      <div class="budget-info-row">
        <span class="budget-label" id="budgetProgressLabel">預算使用 0%</span>
        <span class="budget-status normal" id="budgetStatusText">尚餘 $0</span>
      </div>
      <div class="progress-track">
        <div id="budgetProgressFill" class="progress-fill"></div>
      </div>
    </section>

    <!-- Top Input & Edit Panel -->
    <section id="inputPanel" class="input-panel" aria-label="品項輸入與編輯區">
      <div class="edit-badge-row">
        <span class="edit-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          編輯模式
        </span>
        <span class="edit-hint">修改下方欄位後點擊更新</span>
      </div>

      <form id="itemForm" novalidate>
        <!-- Item Name + Historical Autocomplete -->
        <div class="form-group">
          <label class="field-label" for="itemNameInput">品項名稱</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="itemNameInput"
              class="text-input"
              placeholder="輸入品項（如：鮮奶、雞蛋）"
              autocomplete="off"
              enterkeyhint="next"
            >
            <button type="button" id="clearNameBtn" class="clear-input-btn" aria-label="清除品項名稱">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <!-- Autocomplete Dropdown -->
          <div id="autocompleteDropdown" class="autocomplete-dropdown" role="listbox"></div>
        </div>

        <!-- Price, Quantity & Item Discount Grid -->
        <div class="metrics-grid">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="field-label" for="itemPriceInput">單價</label>
            <div class="input-wrapper">
              <span class="input-prefix">$</span>
              <input
                type="text"
                inputmode="decimal"
                id="itemPriceInput"
                class="text-input input-with-prefix"
                placeholder="單價"
                autocomplete="off"
                enterkeyhint="done"
              >
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="field-label" for="itemQtySelect">數量</label>
            <div class="select-wrapper">
              <select id="itemQtySelect" class="select-input" aria-label="選擇數量"></select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="field-label" for="itemDiscountSelect">單品折扣</label>
            <div class="select-wrapper">
              <select id="itemDiscountSelect" class="select-input" aria-label="選擇單品折扣">
                <option value="1">原價</option>
                <option value="0.95">95折</option>
                <option value="0.9">9折</option>
                <option value="0.85">85折</option>
                <option value="0.8">8折</option>
                <option value="0.7">7折</option>
                <option value="0.5">買一送一 (5折)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Action Buttons: Add Mode -->
        <div id="addActions" class="action-row">
          <button type="submit" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            加入清單
          </button>
        </div>

        <!-- Action Buttons: Edit Mode -->
        <div id="editActions" class="action-row" style="display: none;">
          <button type="submit" class="btn btn-secondary">更新項目</button>
          <button type="button" id="cancelEditBtn" class="btn btn-neutral">取消</button>
          <button type="button" id="deleteEditBtn" class="btn btn-danger">刪除</button>
        </div>
      </form>
    </section>

    <!-- List Controls Bar -->
    <section class="controls-bar" aria-label="清單控制列">
      <div class="controls-top">
        <span id="countSummary" class="count-summary">共 0 項・已選 0 項</span>
        <div class="controls-actions">
          <button type="button" id="sinkToggleBtn" class="chip-btn" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
            未勾選沉底
          </button>
          <button type="button" id="clearCheckedBtn" class="chip-btn" disabled>清除已勾選</button>
          <button type="button" id="clearAllBtn" class="chip-btn danger-outline" disabled>清空全部</button>
        </div>
      </div>
    </section>

    <!-- Shopping List -->
    <main id="shoppingList" class="shopping-list" aria-live="polite"></main>
  </div>

  <!-- Sticky Bottom Summary Bar -->
  <footer class="sticky-footer" aria-label="總計金額列">
    <div class="sticky-inner">
      <div class="footer-left">
        <span id="footerSelectedText" class="selected-count-label">已選 0 項</span>
        <label id="deductionWrap" class="deduction-inline" for="flatDiscountInput">
          <span>滿額折抵 -$</span>
          <input
            type="text"
            inputmode="decimal"
            id="flatDiscountInput"
            class="deduction-input"
            placeholder="0"
            autocomplete="off"
            aria-label="滿額折抵金額"
          >
        </label>
      </div>
      <div class="footer-right">
        <div class="total-label">總計金額</div>
        <div id="grandTotalText" class="grand-total">$0</div>
      </div>
    </div>
  </footer>

  <!-- Budget Modal -->
  <div id="budgetModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="budgetModalTitle">
    <div class="modal-card">
      <h2 id="budgetModalTitle" class="modal-title">設定採買預算</h2>
      <p class="modal-desc">設定本次賣場採買上限，上方進度條將即時提醒花費比例。</p>
      <div class="input-wrapper">
        <span class="input-prefix">$</span>
        <input
          type="text"
          inputmode="decimal"
          id="budgetModalInput"
          class="text-input input-with-prefix"
          placeholder="輸入預算金額（留空或 0 代表不設限）"
          autocomplete="off"
        >
      </div>
      <div class="preset-chips">
        <button type="button" class="preset-chip" data-budget-preset="500">$500</button>
        <button type="button" class="preset-chip" data-budget-preset="1000">$1,000</button>
        <button type="button" class="preset-chip" data-budget-preset="2000">$2,000</button>
        <button type="button" class="preset-chip" data-budget-preset="3000">$3,000</button>
        <button type="button" class="preset-chip" data-budget-preset="0">清除預算</button>
      </div>
      <div class="modal-actions">
        <button type="button" id="budgetCancelBtn" class="btn btn-neutral">取消</button>
        <button type="button" id="budgetSaveBtn" class="btn btn-primary">儲存預算</button>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal (Replaces window.confirm) -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-card">
      <h2 id="confirmModalTitle" class="modal-title">確認操作</h2>
      <p id="confirmModalDesc" class="modal-desc"></p>
      <div class="modal-actions">
        <button type="button" id="confirmCancelBtn" class="btn btn-neutral">取消</button>
        <button type="button" id="confirmOkBtn" class="btn btn-danger">確認清除</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      /* =========================================
         Constants & State Management
         ========================================= */
      const STORAGE_KEY = 'morandi_supermarket_cart_v1';

      const DISCOUNT_LABELS = {
        '1': '',
        '0.95': '95折',
        '0.9': '9折',
        '0.85': '85折',
        '0.8': '8折',
        '0.7': '7折',
        '0.5': '買一送一'
      };

      let state = {
        items: [],
        budget: 0,
        flatDiscount: 0,
        sinkUnchecked: false,
        history: {} // { [name]: { price: number, updatedAt: number } }
      };

      let editingId = null;
      let pendingConfirmCallback = null;
      let toastTimer = null;

      /* =========================================
         DOM Elements
         ========================================= */
      const el = {
        budgetBtn: document.getElementById('budgetBtn'),
        budgetBtnText: document.getElementById('budgetBtnText'),
        budgetCard: document.getElementById('budgetCard'),
        budgetProgressLabel: document.getElementById('budgetProgressLabel'),
        budgetStatusText: document.getElementById('budgetStatusText'),
        budgetProgressFill: document.getElementById('budgetProgressFill'),

        inputPanel: document.getElementById('inputPanel'),
        itemForm: document.getElementById('itemForm'),
        itemNameInput: document.getElementById('itemNameInput'),
        clearNameBtn: document.getElementById('clearNameBtn'),
        autocompleteDropdown: document.getElementById('autocompleteDropdown'),
        itemPriceInput: document.getElementById('itemPriceInput'),
        itemQtySelect: document.getElementById('itemQtySelect'),
        itemDiscountSelect: document.getElementById('itemDiscountSelect'),
        addActions: document.getElementById('addActions'),
        editActions: document.getElementById('editActions'),
        cancelEditBtn: document.getElementById('cancelEditBtn'),
        deleteEditBtn: document.getElementById('deleteEditBtn'),

        countSummary: document.getElementById('countSummary'),
        sinkToggleBtn: document.getElementById('sinkToggleBtn'),
        clearCheckedBtn: document.getElementById('clearCheckedBtn'),
        clearAllBtn: document.getElementById('clearAllBtn'),
        shoppingList: document.getElementById('shoppingList'),

        footerSelectedText: document.getElementById('footerSelectedText'),
        deductionWrap: document.getElementById('deductionWrap'),
        flatDiscountInput: document.getElementById('flatDiscountInput'),
        grandTotalText: document.getElementById('grandTotalText'),

        budgetModal: document.getElementById('budgetModal'),
        budgetModalInput: document.getElementById('budgetModalInput'),
        budgetCancelBtn: document.getElementById('budgetCancelBtn'),
        budgetSaveBtn: document.getElementById('budgetSaveBtn'),

        confirmModal: document.getElementById('confirmModal'),
        confirmModalTitle: document.getElementById('confirmModalTitle'),
        confirmModalDesc: document.getElementById('confirmModalDesc'),
        confirmCancelBtn: document.getElementById('confirmCancelBtn'),
        confirmOkBtn: document.getElementById('confirmOkBtn'),

        toast: document.getElementById('toast')
      };

      /* =========================================
         Utility Functions
         ========================================= */
      function populateQtySelect(maxQty = 20) {
        const currentVal = el.itemQtySelect.value || '1';
        el.itemQtySelect.innerHTML = '';
        for (let i = 1; i <= maxQty; i++) {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = String(i);
          el.itemQtySelect.appendChild(opt);
        }
        el.itemQtySelect.value = currentVal;
      }

      /**
       * Sanitizes numeric input strings while allowing decimals.
       */
      function sanitizeDecimalInput(raw) {
        // Convert full-width digits/dot if user uses Chinese keyboard
        let str = String(raw)
          .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/．/g, '.')
          .replace(/[^0-9.]/g, '');

        const parts = str.split('.');
        if (parts.length > 2) {
          str = parts[0] + '.' + parts.slice(1).join('');
        }
        if (parts[1] && parts[1].length > 2) {
          str = parts[0] + '.' + parts[1].slice(0, 2);
        }
        return str;
      }

      /**
       * Formats numbers with thousand separators; omits trailing .00 for integers.
       */
      function formatMoney(amount) {
        const rounded = Math.round((Number(amount) || 0) * 100) / 100;
        const isInt = Math.abs(rounded - Math.round(rounded)) < 0.001;
        return rounded.toLocaleString('zh-TW', {
          minimumFractionDigits: isInt ? 0 : 1,
          maximumFractionDigits: 2
        });
      }

      function calcItemSubtotal(item) {
        const raw = item.price * item.qty * item.discount;
        return Math.round(raw * 100) / 100;
      }

      function generateId() {
        return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        el.toast.textContent = message;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.toast.classList.remove('show');
        }, 2000);
      }

      /* =========================================
         LocalStorage Persistence
         ========================================= */
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state.items = Array.isArray(parsed.items) ? parsed.items : [];
            state.budget = Number(parsed.budget) > 0 ? Number(parsed.budget) : 0;
            state.flatDiscount = Number(parsed.flatDiscount) > 0 ? Number(parsed.flatDiscount) : 0;
            state.sinkUnchecked = Boolean(parsed.sinkUnchecked);
            state.history = parsed.history && typeof parsed.history === 'object' ? parsed.history : {};
          }
        } catch (err) {
          console.warn('無法讀取暫存資料:', err);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('無法儲存暫存資料:', err);
        }
      }

      function recordHistory(name, price) {
        const trimmed = name.trim();
        if (!trimmed) return;
        state.history[trimmed] = {
          price: price,
          updatedAt: Date.now()
        };
        // Keep history tidy (max 80 most recent items)
        const keys = Object.keys(state.history);
        if (keys.length > 80) {
          keys.sort((a, b) => (state.history[b].updatedAt || 0) - (state.history[a].updatedAt || 0));
          const toKeep = {};
          keys.slice(0, 80).forEach(k => { toKeep[k] = state.history[k]; });
          state.history = toKeep;
        }
      }

      /* =========================================
         Historical Autocomplete Logic
         ========================================= */
      function renderAutocomplete() {
        const query = el.itemNameInput.value.trim().toLowerCase();
        const entries = Object.entries(state.history)
          .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

        const matches = query
          ? entries.filter(([name]) => name.toLowerCase().includes(query)).slice(0, 6)
          : entries.slice(0, 5);

        if (matches.length === 0) {
          closeAutocomplete();
          return;
        }

        // If exact single match already typed and price filled, no need to obstruct
        if (matches.length === 1 && matches[0][0].toLowerCase() === query && el.itemPriceInput.value !== '') {
          closeAutocomplete();
          return;
        }

        const headerText = query ? '歷史品項建議' : '最近買過的品項';
        el.autocompleteDropdown.innerHTML =
          `<div class="autocomplete-header">${headerText}</div>` +
          matches.map(([name, info]) => `
            <div class="autocomplete-item" role="option" data-name="${escapeHtml(name)}" data-price="${info.price}">
              <span class="autocomplete-name">${escapeHtml(name)}</span>
              <span class="autocomplete-price">$${formatMoney(info.price)}</span>
            </div>
          `).join('');

        el.autocompleteDropdown.classList.add('open');
      }

      function closeAutocomplete() {
        el.autocompleteDropdown.classList.remove('open');
      }

      /* =========================================
         Edit Mode & Form Handling
         ========================================= */
      function enterEditMode(itemId) {
        const item = state.items.find(i => i.id === itemId);
        if (!item) return;

        editingId = item.id;
        el.inputPanel.classList.add('editing');
        el.addActions.style.display = 'none';
        el.editActions.style.display = 'flex';

        el.itemNameInput.value = item.name;
        el.itemPriceInput.value = String(item.price);

        // Ensure dropdown supports quantities > 20 if incremented via stepper
        if (item.qty > 20) {
          populateQtySelect(item.qty);
        } else {
          populateQtySelect(20);
        }
        el.itemQtySelect.value = String(item.qty);
        el.itemDiscountSelect.value = String(item.discount);

        updateClearNameBtn();
        closeAutocomplete();
        renderAll();

        // Smooth scroll to top input panel for one-handed editing
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function exitEditMode() {
        editingId = null;
        el.inputPanel.classList.remove('editing');
        el.addActions.style.display = 'flex';
        el.editActions.style.display = 'none';

        el.itemNameInput.value = '';
        el.itemPriceInput.value = '';
        populateQtySelect(20);
        el.itemQtySelect.value = '1';
        el.itemDiscountSelect.value = '1';

        updateClearNameBtn();
        closeAutocomplete();
        renderAll();
      }

      function updateClearNameBtn() {
        if (el.itemNameInput.value.length > 0) {
          el.clearNameBtn.classList.add('visible');
        } else {
          el.clearNameBtn.classList.remove('visible');
        }
      }

      function handleFormSubmit(e) {
        e.preventDefault();

        const name = el.itemNameInput.value.trim();
        const priceStr = sanitizeDecimalInput(el.itemPriceInput.value);
        const price = parseFloat(priceStr);
        const qty = parseInt(el.itemQtySelect.value, 10) || 1;
        const discount = parseFloat(el.itemDiscountSelect.value) || 1;

        if (!name) {
          showToast('請輸入品項名稱');
          el.itemNameInput.focus();
          return;
        }

        if (isNaN(price) || price < 0) {
          showToast('請輸入正確的單價金額');
          el.itemPriceInput.focus();
          return;
        }

        recordHistory(name, price);

        if (editingId) {
          const target = state.items.find(i => i.id === editingId);
          if (target) {
            target.name = name;
            target.price = price;
            target.qty = qty;
            target.discount = discount;
            showToast('已更新項目');
          }
          saveState();
          exitEditMode();
        } else {
          const newItem = {
            id: generateId(),
            name: name,
            price: price,
            qty: qty,
            discount: discount,
            checked: true, // Default checked so it immediately adds to cart total
            createdAt: Date.now()
          };
          // Prepend newest item to top for immediate visibility
          state.items.unshift(newItem);
          saveState();
          exitEditMode();
          showToast(`已加入「${name}」`);
        }
      }

      /* =========================================
         Rendering Functions
         ========================================= */
      function renderAll() {
        renderList();
        renderSummaryAndBudget();
        renderControls();
      }

      function renderControls() {
        const totalCount = state.items.length;
        const checkedCount = state.items.filter(i => i.checked).length;

        el.countSummary.textContent = `共 ${totalCount} 項・已選 ${checkedCount} 項`;

        el.sinkToggleBtn.classList.toggle('active', state.sinkUnchecked);
        el.sinkToggleBtn.setAttribute('aria-pressed', String(state.sinkUnchecked));

        el.clearCheckedBtn.disabled = checkedCount === 0;
        el.clearAllBtn.disabled = totalCount === 0;
      }

      function renderSummaryAndBudget() {
        const checkedItems = state.items.filter(i => i.checked);
        const checkedSubtotal = checkedItems.reduce((sum, item) => sum + calcItemSubtotal(item), 0);
        const netTotal = Math.max(0, Math.round((checkedSubtotal - state.flatDiscount) * 100) / 100);

        // Sticky Footer
        el.footerSelectedText.textContent = `已選 ${checkedItems.length} 項`;
        el.grandTotalText.textContent = `$${formatMoney(netTotal)}`;

        if (document.activeElement !== el.flatDiscountInput) {
          el.flatDiscountInput.value = state.flatDiscount > 0 ? String(state.flatDiscount) : '';
        }
        el.deductionWrap.classList.toggle('active', state.flatDiscount > 0);

        // Budget Header & Progress Bar
        if (state.budget > 0) {
          el.budgetBtn.classList.add('has-budget');
          el.budgetBtnText.textContent = `預算 $${formatMoney(state.budget)}`;
          el.budgetCard.classList.add('visible');

          const pct = Math.round((netTotal / state.budget) * 100);
          const diff = Math.round((state.budget - netTotal) * 100) / 100;

          el.budgetProgressLabel.textContent = `預算使用 ${pct}%`;
          el.budgetProgressFill.style.width = `${Math.min(pct, 100)}%`;

          // Reset classes
          el.budgetProgressFill.classList.remove('warning', 'over');
          el.budgetStatusText.classList.remove('normal', 'warning', 'over');
          el.grandTotalText.classList.remove('over-budget');

          if (netTotal > state.budget) {
            el.budgetProgressFill.classList.add('over');
            el.budgetStatusText.classList.add('over');
            el.budgetStatusText.textContent = `超支 $${formatMoney(Math.abs(diff))}`;
            el.grandTotalText.classList.add('over-budget');
          } else if (pct >= 85) {
            el.budgetProgressFill.classList.add('warning');
            el.budgetStatusText.classList.add('warning');
            el.budgetStatusText.textContent = diff === 0 ? '剛好達預算' : `尚餘 $${formatMoney(diff)}`;
          } else {
            el.budgetStatusText.classList.add('normal');
            el.budgetStatusText.textContent = `尚餘 $${formatMoney(diff)}`;
          }
        } else {
          el.budgetBtn.classList.remove('has-budget');
          el.budgetBtnText.textContent = '設定預算';
          el.budgetCard.classList.remove('visible');
          el.grandTotalText.classList.remove('over-budget');
        }
      }

      function renderList() {
        if (state.items.length === 0) {
          el.shoppingList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
              </div>
              <p class="empty-title">購物車目前是空的</p>
              <p class="empty-desc">在上方輸入品項與金額，勾選後將自動幫你計算總價。</p>
            </div>
          `;
          return;
        }

        // Prepare display order (sink unchecked to bottom if enabled)
        let displayItems = [...state.items];
        if (state.sinkUnchecked) {
          displayItems.sort((a, b) => {
            if (a.checked === b.checked) return 0;
            return a.checked ? -1 : 1;
          });
        }

        el.shoppingList.innerHTML = displayItems.map(item => {
          const subtotal = calcItemSubtotal(item);
          const origSubtotal = Math.round(item.price * item.qty * 100) / 100;
          const discountLabel = DISCOUNT_LABELS[String(item.discount)] || '';
          const isEditing = item.id === editingId;
          const cardClasses = [
            'item-card',
            item.checked ? 'checked' : 'unchecked',
            isEditing ? 'editing-active' : ''
          ].filter(Boolean).join(' ');

          return `
            <article class="${cardClasses}" data-id="${escapeHtml(item.id)}">
              <button
                type="button"
                class="checkbox-hit"
                data-action="toggle"
                aria-label="${item.checked ? '取消勾選' : '勾選'} ${escapeHtml(item.name)}"
                aria-pressed="${item.checked}"
              >
                <span class="checkbox-box">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
              </button>

              <div class="item-info" data-action="edit">
                <div class="item-title-row">
                  <span class="item-name">${escapeHtml(item.name)}</span>
                  ${discountLabel ? `<span class="discount-tag">${discountLabel}</span>` : ''}
                </div>
                <div class="item-meta-row">
                  <span class="item-calc">$${formatMoney(item.price)} × ${item.qty}</span>
                  <div>
                    ${item.discount < 1 ? `<span class="item-orig-subtotal">$${formatMoney(origSubtotal)}</span>` : ''}
                    <span class="item-subtotal">$${formatMoney(subtotal)}</span>
                  </div>
                </div>
              </div>

              <div class="stepper" data-action="stepper">
                <button
                  type="button"
                  class="stepper-btn"
                  data-action="dec"
                  aria-label="減少數量"
                  ${item.qty <= 1 ? 'disabled' : ''}
                >−</button>
                <span class="stepper-val">${item.qty}</span>
                <button
                  type="button"
                  class="stepper-btn"
                  data-action="inc"
                  aria-label="增加數量"
                >+</button>
              </div>
            </article>
          `;
        }).join('');
      }

      /* =========================================
         Custom Modals Helpers
         ========================================= */
      function openConfirmModal(title, desc, okLabel, onConfirm) {
        el.confirmModalTitle.textContent = title;
        el.confirmModalDesc.textContent = desc;
        el.confirmOkBtn.textContent = okLabel;
        pendingConfirmCallback = onConfirm;
        el.confirmModal.classList.add('open');
      }

      function closeConfirmModal() {
        el.confirmModal.classList.remove('open');
        pendingConfirmCallback = null;
      }

      function openBudgetModal() {
        el.budgetModalInput.value = state.budget > 0 ? String(state.budget) : '';
        el.budgetModal.classList.add('open');
        setTimeout(() => el.budgetModalInput.focus(), 60);
      }

      function closeBudgetModal() {
        el.budgetModal.classList.remove('open');
      }

      /* =========================================
         Event Listeners
         ========================================= */
      function bindEvents() {
        // Form submit
        el.itemForm.addEventListener('submit', handleFormSubmit);

        // Name input & Autocomplete
        el.itemNameInput.addEventListener('input', () => {
          updateClearNameBtn();
          renderAutocomplete();
        });

        el.itemNameInput.addEventListener('focus', () => {
          renderAutocomplete();
        });

        el.clearNameBtn.addEventListener('click', () => {
          el.itemNameInput.value = '';
          updateClearNameBtn();
          el.itemNameInput.focus();
          renderAutocomplete();
        });

        // Autocomplete selection
        el.autocompleteDropdown.addEventListener('click', (e) => {
          const option = e.target.closest('.autocomplete-item');
          if (!option) return;
          el.itemNameInput.value = option.dataset.name || '';
          el.itemPriceInput.value = option.dataset.price || '';
          updateClearNameBtn();
          closeAutocomplete();
        });

        // Close autocomplete when clicking outside
        document.addEventListener('click', (e) => {
          if (!el.inputPanel.contains(e.target)) {
            closeAutocomplete();
          }
        });

        // Sanitize numeric inputs in real time
        el.itemPriceInput.addEventListener('input', (e) => {
          const clean = sanitizeDecimalInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
        });

        el.budgetModalInput.addEventListener('input', (e) => {
          const clean = sanitizeDecimalInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
        });

        // Inline Flat Store Discount (滿額折抵)
        el.flatDiscountInput.addEventListener('input', (e) => {
          const clean = sanitizeDecimalInput(e.target.value);
          if (e.target.value !== clean) e.target.value = clean;
          const val = parseFloat(clean);
          state.flatDiscount = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
        });

        el.flatDiscountInput.addEventListener('blur', () => {
          el.flatDiscountInput.value = state.flatDiscount > 0 ? String(state.flatDiscount) : '';
        });

        // Edit Mode Cancel & Delete
        el.cancelEditBtn.addEventListener('click', exitEditMode);

        el.deleteEditBtn.addEventListener('click', () => {
          if (!editingId) return;
          const target = state.items.find(i => i.id === editingId);
          state.items = state.items.filter(i => i.id !== editingId);
          saveState();
          exitEditMode();
          if (target) showToast(`已刪除「${target.name}」`);
        });

        // Shopping List Event Delegation (Checkbox, Edit Card, Inline Stepper)
        el.shoppingList.addEventListener('click', (e) => {
          const card = e.target.closest('.item-card');
          if (!card) return;
          const id = card.dataset.id;
          const item = state.items.find(i => i.id === id);
          if (!item) return;

          const actionEl = e.target.closest('[data-action]');
          const action = actionEl ? actionEl.dataset.action : 'edit';

          if (action === 'toggle') {
            e.stopPropagation();
            item.checked = !item.checked;
            saveState();
            renderAll();
            return;
          }

          if (action === 'dec') {
            e.stopPropagation();
            if (item.qty > 1) {
              item.qty -= 1;
              if (editingId === item.id) {
                el.itemQtySelect.value = String(item.qty);
              }
              saveState();
              renderAll();
            }
            return;
          }

          if (action === 'inc') {
            e.stopPropagation();
            if (item.qty < 99) {
              item.qty += 1;
              if (editingId === item.id) {
                if (item.qty > 20) populateQtySelect(item.qty);
                el.itemQtySelect.value = String(item.qty);
              }
              saveState();
              renderAll();
            }
            return;
          }

          if (action === 'stepper') {
            e.stopPropagation();
            return;
          }

          // Clicking card body enters edit mode
          enterEditMode(id);
        });

        // List Controls
        el.sinkToggleBtn.addEventListener('click', () => {
          state.sinkUnchecked = !state.sinkUnchecked;
          saveState();
          renderAll();
        });

        el.clearCheckedBtn.addEventListener('click', () => {
          const checkedCount = state.items.filter(i => i.checked).length;
          if (checkedCount === 0) return;
          openConfirmModal(
            '清除已勾選項目？',
            `將會刪除已勾選的 ${checkedCount} 個項目，並保留尚未勾選的品項。`,
            '確認清除',
            () => {
              state.items = state.items.filter(i => !i.checked);
              if (editingId && !state.items.some(i => i.id === editingId)) {
                exitEditMode();
              }
              saveState();
              renderAll();
              showToast(`已清除 ${checkedCount} 個已勾選項目`);
            }
          );
        });

        el.clearAllBtn.addEventListener('click', () => {
          if (state.items.length === 0) return;
          openConfirmModal(
            '清空所有清單？',
            `將會刪除清單中全部 ${state.items.length} 個項目（歷史品項記憶仍會保留）。`,
            '清空全部',
            () => {
              state.items = [];
              state.flatDiscount = 0;
              if (editingId) exitEditMode();
              saveState();
              renderAll();
              showToast('已清空購物清單');
            }
          );
        });

        // Budget Modal Events
        el.budgetBtn.addEventListener('click', openBudgetModal);
        el.budgetCard.addEventListener('click', openBudgetModal);
        el.budgetCancelBtn.addEventListener('click', closeBudgetModal);
        el.budgetModal.addEventListener('click', (e) => {
          if (e.target === el.budgetModal) closeBudgetModal();
        });
        el.budgetModal.querySelectorAll('[data-budget-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = Number(btn.dataset.budgetPreset);
            el.budgetModalInput.value = val > 0 ? String(val) : '';
          });
        });
        el.budgetSaveBtn.addEventListener('click', () => {
          const val = parseFloat(sanitizeDecimalInput(el.budgetModalInput.value));
          state.budget = (!isNaN(val) && val > 0) ? Math.round(val * 100) / 100 : 0;
          saveState();
          renderSummaryAndBudget();
          closeBudgetModal();
          showToast(state.budget > 0 ? `預算已設為 $${formatMoney(state.budget)}` : '已清除預算上限');
        });
        el.budgetModalInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            el.budgetSaveBtn.click();
          }
        });

        // Confirmation Modal Events
        el.confirmCancelBtn.addEventListener('click', closeConfirmModal);
        el.confirmModal.addEventListener('click', (e) => {
          if (e.target === el.confirmModal) closeConfirmModal();
        });
        el.confirmOkBtn.addEventListener('click', () => {
          if (typeof pendingConfirmCallback === 'function') {
            pendingConfirmCallback();
          }
          closeConfirmModal();
        });
      }

      /* =========================================
         Initialize App
         ========================================= */
      function init() {
        populateQtySelect(20);
        loadState();
        bindEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
